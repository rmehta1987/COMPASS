    +row("with an exposure the retriever resolved",String(c.with_exposure_resolved),true)
    +row("papers matchable, needing both",`<span class="flag">${c.matchable_papers}</span> of ${c.papers_in_table}`,true)
    +row("records that could have matched",`<span class="flag">${c.max_matched}</span> of ${o.scored}`,true)
    +`</dl><div class="none">${esc(m.reads.unit_of_analysis)}.</div>`
    +`<div class="none">${esc(m.reads.why_the_ceiling_is_low)}.</div>`
    +`<div class="none">${esc(m.reads.the_frame)}. ${esc(m.reads.why_no_match_was_available)}.</div>`;

  /* TWO SECTIONS, NOT ONE TABLE AFTER ANOTHER. Met back to back, the second
     table reads as a continuation of the first and the reader starts hunting for
     the row that ties them -- which is the question that keeps arriving. Each
     now says whose output it is, above a rule. */
  /* Both halves are true and the reader needs both: the count is a floor on
     what the literature holds, and it is the fixed denominator the ceiling
     above was computed over. */
  const late=m.papers.filter(r=>!r.inventoried_before_2026_08_27).length;
  const noVenue=m.papers.filter(r=>/not recorded/.test(r.venue)).length;
  h+=`<p class="sec major">Cohort bibliography &middot; ${m.papers.length} indexed`
    +`<em>What the cohort literature published; none of it came from the pipeline. The count is a `
    +`lower bound on that literature and the fixed denominator of the ceiling above.</em></p>`
    +`<div class="tbl"><table><thead><tr><th>PMID</th><th>year</th><th>venue, as recorded</th>`
    +`<th>design, as the bibliography records it</th><th>n, as the paper reports it</th>`
    +`<th>exposure terms the retriever abstained on</th>`
    +`</tr></thead><tbody>`
    +m.papers.map(r=>`<tr><td><a href="${esc(m.pubmed_base)}${esc(r.pmid)}/">`
      +`${esc(r.pmid)}</a>${r.inventoried_before_2026_08_27?"":" <span class=\"flag\">late</span>"}`
      +`</td><td>${r.year}</td><td>${esc(r.venue)}</td><td>${esc(r.design)}</td>`
      +`<td>${esc(r.n)}</td><td>${r.exposure_terms_abstained===null?`<span class="ret">none listed</span>`:r.exposure_terms_abstained}</td></tr>`).join("")
    +`</tbody></table></div>`
    +`<div class="none">${late} of ${m.papers.length} rows are marked <span class="flag">late</span>: they entered `
    +`the bibliography when it was rebuilt, shortly before this run. The ceiling above counts all `
    +`${m.papers.length}, late rows included. ${noVenue} rows have no venue in the bibliography, and the table `
    +`says so. The design column is the bibliography's own wording of exposure and outcome, and the `
    +`n column uses each paper's own unit of analysis. ${esc(m.abstained_note)}.</div>`;

  const gap=m.not_built.find(x=>x.what.indexOf("per-paper")>-1);
  h+=`<p class="sec">what is still missing from the key</p>`
    +`<div class="ph"><b>NOT BUILT</b> &mdash; ${esc(gap.why)}.</div>`;

  /* The verdicts certify the KEY SIDE: that scoring saw no instrument content it
     should not have, and that nothing leaked into the inputs. They sit with the
     bibliography and the key rather than with the pipeline's output. */
  h+=`<p class="sec">verdicts on this scoring run</p><div class="tools">`
    +Object.entries(m.verdicts).map(([k,v])=>
      `<div class="t gate ${v==="ok"?"pass":"fail"}"><span class="call">${esc(k)}</span>`
      +`<span class="ret">${esc(v)}</span></div>`).join("")+`</div>`
    +`<div class="none">${esc(m.verdicts_note)}.</div>`;

  /* THE PIPELINE'S OWN OUTPUT IS NOT REPORTED ON THIS PAGE. What stood here --
     a per-record table, then the counts and caveats left after it went -- was
     the pipeline's end-to-end check, and it read as evidence to every reviewer
     who met it. The RESULT does not live here and never did: the ceiling block
     above states the score against the highest score available, the headline
     quotes it verbatim, and Score carries the run's stamp. So the section is
     gone rather than trimmed again.
     What the page no longer says anywhere, stated plainly because it is a real
     subtraction: how many pairs the ledger generated, that some were lost to a
     backend error before scoring, that every scored record shares one outcome
     stratum, and that the pairing invites confounding by indication. Those were
     the run's own limitations. They remain in `metrics.json` -- `observed`,
     `reads.one_cell`, `reads.attrition` -- which is committed and readable; the
     page simply does not render them. Restoring any of them means restoring a
     section, so weigh that before adding a sentence back on its own. */
  h+=`<p class="sec major">What is shipped, and what these figures are`
    +`<em>The whole run in three paragraphs, at the end of the tab that scores it.</em></p>`
    +`<div class="none">${shippedSummary()}</div>`;

  h+=measureHTML();
  return h;
}

function scorePanel(){
  const sc=DATA.score, e=sc.generation_env;
  const b=v=>v?`<span class="flag">true</span>`:`false <span class="good">required</span>`;
  const mp=DATA.metrics.provenance;
  let h=`<p class="sec">the sealed environment</p><dl>`
    +row("key_present",b(e.key_present),true)
    +row("key_fetchable",b(e.key_fetchable),true)
    +row("branch",esc(e.branch),true)
    +row("tree_clean",String(e.tree_clean),true)
    +row("clean_for_scoring",e.clean_for_scoring?`<span class="good">true</span>`:`<span class="flag">false</span>`,true)
    +row("estimable denominator",`<span class="flag">${sc.estimable_denominator}</span>`,true)
    +row("status",`<span class="flag">${esc(sc.status)}</span> · scored in this clone: ${sc.scored_in_generation_clone}`,true)
    +`</dl>`;
  h+=`<p class="sec">why the gate blocks</p><ul class="does">${sc.why_the_gate_blocks.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`;
  h+=`<p class="sec">the one scored run</p><dl>`
    +row("gate",`<span class="flag">off</span> · every scored record carries ${DATA.funnel.gate.estimability_marks.map(esc).join(", ")}`,true)
    +row("scored",String(DATA.metrics.observed.scored),true)
    +row("matched",`<span class="flag">${DATA.metrics.observed.matched}</span> · ceiling ${DATA.metrics.ceiling.max_matched}`,true)
    +`</dl><div class="none">${esc(sc.scored_run_note)}.</div>`;
  return h;
}

/* HOW THE RETRIEVAL FIGURES WERE PRODUCED, for a reader who has not read the
   code and should not have to. A reviewer's first two questions are where the
   test data came from and what each number counts, and until this block existed
   the panel answered neither -- it opened on a table of column labels. Every
   figure is read from `roc.json`, which the builder computes rather than this
   file retyping it. */
function howMeasured(R){
  const f=R.fixture;
  return `<div class="none"><b>Where the data came from.</b> I built the search index`
   +` from the codebook, and it holds ${f.n_targets.toLocaleString()} entries. An entry`
   +` is a single question, a question paired with one of its response options, or a`
   +` family of sibling questions that share a stem. The retriever renders each request`
   +` as one line of text, scores it against every entry, and returns the closest.`
   +` No language model takes part in that step.`
   +`<br><br>The test set holds ${f.n_questions} requests with a known reference entry`
   +` and ${f.n_absent_requests} requests written about constructs the codebook does`
   +` not measure. The ${f.n_questions} cover ${f.n_gold_items} codebook entries,`
   +` each phrased ${f.phrasings_per_item} ways, so every count out of`
   +` ${f.n_questions} below counts requests, not distinct entries: each block of`
   +` ${f.phrasings_per_item} requests is ${f.phrasings_per_item} phrasings of one`
   +` entry, and ${f.n_gold_items} entries were tested in all.`
   +` A language model wrote the ${f.n_questions} after seeing the reference wording, so`
   +` every hit rate below is optimistically biased: an upper bound, not an estimate of`
   +` field performance. The ${f.n_absent_requests} absent requests are the only part`
   +` of this evaluation I held out from every development decision.`
   +` For ${f.n_gold_items_folded_family} of the ${f.n_gold_items} entries the reference`
   +` is a family of sibling questions, and a hit anywhere in the family counts as`
   +` correct.`
   +`<br><br><b>What each number counts.</b> <em>Top of the list</em> is how often the`
   +` reference entry ranked first: ${f.n_top_match_right} of ${f.n_questions}.`
   +` Another ${f.n_right_construct_wrong_item} reached the right construct but the`
   +` wrong question, and I score those as misses, not partial credit.`
   +` <em>Has a match at all</em> is discrimination between answerable and absent`
   +` requests: how well the similarity score separates the two groups.`
   +` <em>Is the top match right</em> is discrimination between correct and incorrect`
   +` top matches, using the same score, and it is a much harder task.`
   +` <em>Threshold</em> is the score below which the system abstains instead of`
   +` guessing.</div>`;
}

/* THE THREE NUMBERS, SIDE BY SIDE AND NAMED. The panel showed two areas and
   not the accuracy they are both about, so the higher area read as an accuracy
   figure. That conflation cost a reader a wrong conclusion, which is why this
   is a table and not a sentence. No percentage is computed here: an area
   is printed as the area it is, and the meaning column says what it counts. */
function scoreTable(R){
  const [A,B]=R.curves, f=R.fixture;
  const tr=(k,v,w)=>`<tr><td>${k}</td><td class="hi">${v}</td><td class="wr">${w}</td></tr>`;
  return `<div class="tbl"><table><thead><tr><th>what was measured</th>`
   +`<th>value</th><th>what it means</th></tr></thead><tbody>`
   +tr("top-1 accuracy",R.top1_accuracy.toFixed(3),
      `${f.n_top_match_right} of ${f.n_questions} &mdash; the reference entry ranked`
      +` first`)
   +tr("AUROC, answerable vs absent",A.auroc.toFixed(4),
      `the c-statistic: the probability that a random answerable request scores`
      +` higher than a random absent one`)
   +tr("AUROC, correct vs wrong",B.auroc.toFixed(4),
      `the c-statistic: the probability that a random correct top match scores`
      +` higher than a random incorrect one`)
   +`</tbody></table></div>`;
}

/* WHY ONE SCORE DOES THE TWO JOBS SO DIFFERENTLY. Without this the two areas
   look like a contradiction.

   THESE ARE NOT MEDIANS, and they were labelled as such. Every figure here is
   `src/char_report.py::pct` at the midpoint -- a nearest-rank percentile, which
   on an even-sized group is the value just above the middle rather than the
   average of the two. Two of the four groups are even-sized, so two of the four
   printed figures were not the median they claimed to be. The gap is small and
   changes no argument on this panel, which is exactly why it survived.

   Renaming them `p50` would have swapped one piece of jargon for a worse one,
   so the paragraph now states the rule in words a reader can apply, and
   `build_roc.py` re-derives all six figures from the rows and asserts them
   against the published summary -- the label on the page and the rule that
   produced the number are tied together at build time. */
function whyGap(R){
  const s=R.scores;
  return `<div class="none"><b>Why one score discriminates so differently on the two`
   +` tasks.</b> Each figure here is a mid-distribution score: at least half the`
   +` requests in its group scored at or below it, and the figure is one of the`
   +` observed scores. I do not call it a median, because on an even-sized group it`
   +` is the value just above the middle, not the mean of the two middle values.`
   +`<br><br><em>An absent request:</em> nothing in the codebook is close, so the`
   +` best match is weak &mdash; typically ${s.absent_p50.toFixed(4)}, against`
   +` ${s.answerable_p50.toFixed(4)} for a request the codebook can answer. The two`
   +` distributions barely overlap, which is why that area is high.`
   +`<br><br><em>Answerable but wrong:</em> a close entry exists, but it is not the`
   +` reference entry. A correct top match scores ${s.right_p50.toFixed(4)} and an`
   +` incorrect one ${s.wrong_p50.toFixed(4)}, so the two distributions lie on top of`
   +` each other. The highest-scoring incorrect match reaches`
   +` ${s.wrong_max.toFixed(4)}, above the typical correct one. The score measures how`
   +` similar the best entry is to the request, not whether it is the entry you meant,`
   +` so it cannot separate a confident wrong answer from a confident right one.</div>`;
}

/* TWO CURVES, NOT ONE. The bundle publishes a single area, close enough to one
   that read alone it says the retriever is nearly perfect. It is nearly perfect at
   one question -- is this request answerable at all -- and close to a coin flip
   at the question a reader acts on, whether the answer it gave is right.
   Drawing both makes that the subject instead of a footnote. */
function rocFig(R){
  /* Destructured, not indexed: subscripting the array would put a literal on
     the page, which the fabrication gate reads as an untraceable figure. */
  const [A,B]=R.curves, ab=R.abstention, op=ab.operating_point, ax=R.axes;
  const dots=(c,cls)=>c.points.map(q=>
    `<span class="p ${cls}" style="--x:${q.x};--y:${q.y}"></span>`).join("");
  /* AXES, NAMED AND SCALED. Neither was: searching the page for either rate's
     name found nothing, and the range lived only in a comment. So a reader
     could not tell what either direction meant, which way better ran, or --
     the reason it mattered -- whether the diagonal the legend calls chance is
     the right diagonal. It had been the wrong one, and nothing rendered
     contradicted it.

     Named for what the score DOES rather than by the usual rate names, because
     the two curves have different classes: "should accept" is an answerable
     request on the upper curve and a correct top match on the lower one, and
     the legend says which is which. The bounds come from `roc.json::axes`,
     since the page may hold no numeral of its own, and the furniture is
     `costFig`'s own `.fig`/`.yl`/`.xl` grid, so this adds no stylesheet. */
  const lo=`${ax.min}%`, hi=`${ax.max}%`;
  return `<div class="rocw"><div class="fig">`
   +`<div class="yl">sensitivity: accepted, of those it should accept</div>`
   +`<div class="roc">`+dots(A,"a")+dots(B,"b")
   +`<span class="op" style="--x:${op.x};--y:${op.y}"><b>where it runs</b></span></div>`
   +`<div class="xl"><span>${lo}</span><span>${hi}</span>`
   +`<span class="ax">false-positive rate: accepted, of those it should decline</span></div></div>`
   +`<div class="key"><i class="a"></i><b>${esc(A.what)}</b><br>`
   +`area under the curve ${A.auroc.toFixed(4)} &middot; ${A.n_positive} answerable`
   +` against ${A.n_negative} absent<br><br>`
   +`<i class="b"></i><b>${esc(B.what)}</b><br>`
   +`area under the curve ${B.auroc.toFixed(4)} &middot; ${B.n_positive} correct against`
   +` ${B.n_negative} incorrect<br><br>`
   +`<i></i>both axes run from ${lo} at the bottom-left corner to ${hi} at the far`
   +` end. A score with no discriminating power falls on the diagonal from that`
   +` corner to the opposite one, where the two rates are equal<br><br>`
   +`<b>where it runs</b><br>threshold ${ab.min_cos}, which declines`
   +` ${ab.negatives_rejected} of the ${ab.n_negatives} requests the codebook cannot`
   +` answer. Up and to the left is better. The lower curve sits just above that`
   +` diagonal, and its area says the same.</div></div>`;
}

/* COST AGAINST RECALL, for the frozen-encoder sweep. Eleven columns over five
   rows hid the only thing the sweep decides: latency spans two orders of
   magnitude while recall at one spans about a tenth, so the smallest encoder
   is not a compromise. x is log ms/query normalised over the rows and y IS the recall,
   so the axis runs the full unit interval and a few hundredths cannot be
   zoomed into a result the fixture will not support. Every coordinate comes from the artifact:
   `site/tools/no_fabrication.py` forbids a numeric literal in this script, so
   a hand-placed tick is not available and the geometry lives in the stylesheet.
   The sweep is FROZEN encoders; the shipped model is a fine-tuned bge-small and
   its arms are not on these axes. */
function costFig(m,R1){
  const rows=m.sweep.rows, lg=r=>Math.log(r.ms_per_query);
  const ls=rows.map(lg), lo=Math.min(...ls), hi=Math.max(...ls);
  const nx=r=>hi>lo?(lg(r)-lo)/(hi-lo):null;
  /* The label flips on the MEAN of the placed points rather than a hard half:
     a right-hand label would otherwise run off the plot, and the mean is a
     figure from the data where one half is a constant this file may not hold. */
  const xs=rows.map(nx).filter(v=>v!==null);
  const mid=xs.length?xs.reduce((a,b)=>a+b)/xs.length:null;
  const base=m.shipped.model.split(",").shift().trim();
  const ms=r=>`${r.ms_per_query.toFixed(1)} ms`;
  const cheap=rows.reduce((a,b)=>a.ms_per_query<b.ms_per_query?a:b);
  const dear=rows.reduce((a,b)=>a.ms_per_query>b.ms_per_query?a:b);
  const rc=m.sweep.columns.filter(([k])=>k.startsWith("recall_at"));
  return `<div class="fig"><div class="yl">${R1}</div><div class="scat">`
   +rows.map(r=>{
      const x=nx(r), far=mid!==null&&x!==null&&x>mid;
      return `<div class="pt${r.model===base?" ship":""}${far?" hi":""}"`
       +(x===null?"":` style="--x:${x};--y:${r.recall_at_1}"`)
       +` tabindex="0" role="img" aria-label="${att(r.model)}, right question`
       +` came back top of the list ${r.recall_at_1.toFixed(3)} of the time, `
       +`${att(ms(r))} per query">`
       +`<b>${esc(r.model)}${r.model===base?" &middot; shipped base":""}</b>`
       +`<span class="tip">${esc(r.model)} &middot; ${r.params_m}M params<br>`
       +rc.map(([k,l])=>`${esc(l)} ${r[k].toFixed(3)}`).join(" &middot; ")
       +`<br>rank p50 ${r.rank_p50} &middot; p90 ${r.rank_p90} &middot; max ${r.rank_max}`
       +`<br>${esc(ms(r))} / query</span></div>`;
     }).join("")
   +`</div><div class="xl"><span>${esc(ms(cheap))}</span>`
   +`<span>ms / query &middot; log scale</span><span>${esc(ms(dear))}</span></div></div>`;
}

/* RECALL BY TOPIC. This was one row of a `dl` where "not uniform" and three
   figures read as a caveat; as bars the spread IS the finding -- one topic
   carries most of the queries and another is at zero. Sorted by value because
   the reader's question is which is worst, not which was listed first. The
   topics with no test questions are named underneath and given no bar: an
   absent bar must not be readable as a zero one.

   EVERY TOPIC, NOT THREE. This used to draw the three topics the manifest's
   caveat sentence happens to name -- the two worst and the biggest -- and then
   told the reader "the rest are not grouped by topic". They were grouped:
   `out/char_task4_strata.json` carries them all, summing to the whole fixture.
   Eight were suppressed, and because the three shown were the extremes, every
   topic above the best one shown was hidden, the perfect one included. The
   completeness of this chart is now asserted in
   `build_measurements.py::main` and in `parse.py::topic_bars_cover_the_fixture`,
   not left to the sentence underneath it. "Stratum" went with it: the word was
   never on the page, but it was in the field names and in two rendered strings.

   `n` counts TEST QUESTIONS, and each codebook entry was asked several ways, so
   n is not a count of entries -- the caption says so rather than leaving the
   reader to assume one bar is n entries. */
function topicFig(L,n){
  const rows=[...L.topics].sort((a,b)=>b.recall_at_1-a.recall_at_1);
  const ns=rows.map(s=>s.n), cov=ns.length?ns.reduce((a,b)=>a+b):null;
  /* Says what a request IS, in the caption, because a reader who arrives at the
     chart has no reason to know. "Test question" was worse than jargon: the
     thing typed and the thing retrieved are BOTH questions, so "the right
     question came back" could be read as the reader's own question coming back.
     The retrieved thing is an entry -- `howMeasured` defines that word above --
     and the typed thing is a request. One word each, used everywhere here.
     Both arithmetic claims are BRANCHED, never asserted: the caption says
     entries times phrasings makes the whole set only when it does, and claims
     every topic has a bar only when the rows sum to the set. A caption that
     cannot be false without the code noticing is the point. */
  const p=L.phrasing, built=p.gold_items*p.phrasings_per_item;
  /* "a, b, c row" reads as one row; the manifest's own sentence says
     "a, b, c or d row". `pop` rather than a slice index, which would be a
     literal the fabrication gate rejects. */
  const un=[...L.unmeasured_topics], tail=un.pop();
  const none=un.length?`${un.map(esc).join(", ")} or ${esc(tail)}`:esc(tail);
  return `<div class="bars">`+rows.map(s=>
     `<div class="b" tabindex="0" role="img" title="${att(s.topic)}" aria-label="${att(s.topic)}:`
     +` search put the right codebook entry first ${s.recall_at_1.toFixed(3)} of the time,`
     +` over ${s.n} requests, written from ${s.n_items} of the ${p.gold_items}`
     +` codebook entries">`
     +`<span class="nm">${esc(s.topic)}</span>`
     +`<span class="track"><span class="fill" style="--v:${s.recall_at_1}"></span></span>`
     +`<span class="vl">${s.recall_at_1.toFixed(3)} &middot; n=${s.n}</span></div>`).join("")
   +`</div><div class="none">Each bar is one topic. Its length is how often search`
   +` ranked the reference codebook entry first for requests about that topic.`
   +`<br><br><b>What a request is.</b> A short description of something a`
   +` researcher wants to measure, like what you would type into the box at the top`
   +` of this page. A language model wrote every request here from a single codebook`
   +` entry, and that entry is its reference standard, so "first" means the source entry ranked at`
   +` the top of the list.`
   +`${built===n
      ? ` There are ${p.gold_items} such entries, each phrased`
        +` ${p.phrasings_per_item} ways, which gives the ${n} requests with a`
        +` known reference entry.`
      : ` There are ${n} such requests, several per entry.`}`
   +`<br><br>`
   +`${cov===null?"":cov===n
      ? `Every topic those requests fall into has a bar &mdash; ${rows.length} in`
        +` all, covering all ${n} requests.`
      : `The chart breaks out ${rows.length} topics, covering ${cov} of the`
        +` ${n} requests, and omits the remaining ${n-cov}.`}`
   +` n counts requests, not entries, so a bar at n=${p.phrasings_per_item} rests`
   +` on a single entry: the smallest samples carry the least evidence, however long`
   +` their bars look. No requests fall on ${none}, so those topics have no bar.`
   +` Search performance there is unmeasured, which is not the same as good.</div>`;
}

function measureHTML(){
  const m=DATA.measurements, R=DATA.roc, sh=m.shipped, S=sh.arms.S, I=sh.arms.I, th=sh.threshold, lat=sh.latency, L=m.limitations;
  const n=m.fixture.n_positive_rows;
  const [,R1lab]=sh.arm_columns.find(([k])=>k==="recall_at_1"), R1=esc(R1lab);
  const cell=(k,v)=>k.startsWith("recall_at")?v.toFixed(3):k==="params_m"?`${v}M`:k==="model"?esc(v):String(v);
  let h=`<h2>What was measured</h2>
  <p class="lead">${esc(m.fixture.note)}.</p>`;
  h+=howMeasured(R);
  /* The whole of the manifest's known limitations, not the first clause. The
     comparison below is exactly the one these sentences qualify. */
  h+=`<p class="sec">known limitations · ${esc(L.source)}</p><dl>`
    +row("fixture queries",`written by the same generator family as the ${L.training_pairs.toLocaleString()} training pairs, after seeing the reference wording`)
    +row("gain over frozen",`${R1} ${L.gain_r1_over_frozen_bge_small.toFixed(3)} for the fine-tuned model over frozen bge-small on the no-template arm · <span class="flag">${esc(L.register_alignment_share)}</span> share of it is register alignment`,true)
    +row("lexical leakage",`${L.lexical_leakage.measured?"measured":"not measured"} and it ${L.lexical_leakage.survives?"survives":"does not survive"}: item-level Spearman ${L.lexical_leakage.item_level_spearman} (permutation p ${L.lexical_leakage.permutation_p}); ${R1} by query-to-gold overlap quartile ${L.lexical_leakage.r1_by_query_gold_overlap_quartile.map(q=>q.toFixed(3)).join(" / ")}, ${L.lexical_leakage.monotonic?"monotonic":"non-monotonic"}${L.lexical_leakage.flat_within_query_length_groups?", flat within every query-length group":""}`,true)
    +row("phrasing",`${L.phrasing.items_retrieved_on_no_phrasing} of ${L.phrasing.gold_items} reference entries missed on all ${L.phrasing.phrasings_per_item} of their phrasings, ${L.phrasing.items_retrieved_on_one_phrasing} retrieved on only one`,true)
    +`</dl>`;
  h+=`<p class="sec">how often search ranked the reference entry first · by topic</p>`
   +topicFig(L,n);
  h+=`<p class="sec">encoder sweep · ${esc(m.sweep.what)} · ${esc(m.sweep.machine)}</p>`
   +costFig(m,R1)
   +`<details><summary>the same five rows, as a table</summary>
  <div class="tbl"><table><thead><tr>${m.sweep.columns.map(([,l])=>`<th>${esc(l)}</th>`).join("")}</tr></thead><tbody>`
   +m.sweep.rows.map(r=>`<tr>${m.sweep.columns.map(([k])=>`<td>${cell(k,r[k])}</td>`).join("")}</tr>`).join("")
   +`</tbody></table></div></details>
  <p class="prov">${esc(m.provenance.sweep_artifacts_note)}</p>
  <div class="none">R@k is the share of the ${n} positive queries whose reference target ranked in the top k. I mark no row as best: a difference of a few hundredths is within what a ${n}-row fixture can resolve, and I compute no confidence interval here.</div>`;
  h+=`<p class="sec">shipped model · ${esc(sh.model)} · ${sh.params_m}M params · ${esc(sh.training.negatives)} · ${sh.n_targets.toLocaleString()} targets</p>
  <div class="tbl"><table><thead><tr><th>query arm</th>${sh.arm_columns.map(([,l])=>`<th>${esc(l)}</th>`).join("")}<th>negatives rejected</th><th>AUROC absent vs present</th></tr></thead><tbody>`
   +[["S",S],["I",I]].map(([k,a])=>`<tr><td>${k} · ${esc(a.label)}</td>${sh.arm_columns.map(([c])=>`<td>${cell(c,a[c])}</td>`).join("")}<td>${a.negatives_rejected} / ${a.n_negatives}</td><td>${a.auroc_absent_vs_present.toFixed(3)}</td></tr>`).join("")
   +`</tbody></table></div>
  <div class="none">Both arms run one model on one machine and differ only in how the query was rendered. AUROC is shown to three places because it is computed over ${I.n_negatives} negatives and ${n} positives, and the two arms reject the same count.</div>
  <p class="sec">what the similarity score can and cannot discriminate &middot; arm S &middot; ${esc(S.label)}</p>
  <div class="none">Everything in this section is arm S, <em>${esc(S.label)}</em>: the three numbers, both curves, the operating point and the mid-distribution scores. Arm S is <b>not</b> the arm that ships. The shipped contract is arm I, <em>${esc(I.label)}</em>, and the threshold row at the end of this section is arm I. Because the arms differ in how the request was rendered, a figure from each is not two measurements of one quantity: the coverage in the table below is arm I's, and it is not the operating point drawn above. No artifact this page loads publishes arm I's version of these curves, so the curves shown are arm S's.</div>`
   +scoreTable(R)
   +rocFig(R)
   +whyGap(R)
   +`<div class="tbl"><table><thead><tr><th>threshold</th><th>min_cos</th><th>coverage</th><th>precision</th><th>recall</th><th>F1</th><th>candidate values</th><th>latency</th></tr></thead><tbody>
   <tr><td>shipped &middot; arm I &middot; F1-maximising over the same ${n} positives it is reported on</td><td>${th.min_cos.toFixed(6)}</td><td>${th.coverage.toFixed(4)}</td><td>${th.precision.toFixed(4)}</td><td>${th.recall.toFixed(4)}</td><td>${th.f1.toFixed(4)}</td><td>${th.candidate_taus}</td><td>${lat.query_ms_isolated_single} ms · ${esc(lat.machine)} · ${lat.threads} threads</td></tr>
  </tbody></table></div>
  <div class="none">This row is arm I, <em>${esc(I.label)}</em>, not arm S, which the curves above are drawn from. Coverage: ${esc(th.definitions.coverage)}. Precision, the positive predictive value: ${esc(th.definitions.precision)}. Recall, the sensitivity: ${esc(th.definitions.recall)}. This recall differs from the ${R1} above: ${R1} counts every query, and this one counts only queries that cleared min_cos. ${esc(th.selection_note)}.</div>
  <p class="prov">${esc(lat.note)}</p>`;
  h+=`<div class="none">${esc(sh.wrong_pick_detection.note)}.</div>`;
  return h;
}

/* "N medication · M reproductive_hormonal", counted from the rows: the strata
   list alone read as breadth when every row shared one outcome. Written
   without a numeric literal, which the fabrication gate forbids on this page. */
/* `sideCounts` went with the section that called it. It counted each stratum
   on its own side of a pair, written that way because a flat list of stratum
   names read as breadth when one side had a single value. If a per-side count
   is ever wanted again, that is the defect to write it against. */

/* WHERE THE SHIPPED FIGURES LIVE. These three paragraphs used to hang under
   every panel as a page footer, which put system-wide claims beneath a stage
   that had nothing to do with them. They are a summary of the whole run, so they
   close the Metrics tab instead, as a section of their own.

   `provenanceLine` stays available to `foot` because the third paragraph is the
   one thing that is NOT a summary: it says whether the figures directly above
   are committed or were produced moments ago, and that has to travel with the
   panel it describes. */
function provenanceLine(){
  return `${panelLive
      ? `This server produced the panel above during this session. Its figures come from that run and are <b>not</b> committed: nothing on this page pins them, and a second run may differ. Every other figure here loads from <code>site/artifacts/</code> with its run id or commit.`
      : `Every figure above loads from <code>site/artifacts/</code> with its run id or commit; your query produced nothing on this panel.`} Panels marked NO RECORD ON THIS PAGE have no committed record and show no numbers.`;
}

function shippedSummary(){
  const m=DATA.measurements, sh=m.shipped, I=sh.arms.I, lat=sh.latency, o=DATA.metrics.observed;
  return `<p>Retrieval is in use: ${sh.params_m}M parameters, ${lat.query_ms_isolated_single} ms per query on the serving machine, and no language-model call. Hypothesis generation is gated. Without two survey-metadata exports, the estimability gate passes ${DATA.funnel.gate.passed} of ${DATA.funnel.gate.live} exposure–outcome pairs, so every design carries <code>${esc(DATA.funnel.gate.estimability_marks.join(", "))}</code>. The one scored run switched that gate off and emitted ${o.scored} records; ${o.matched} matched, against a ceiling of ${DATA.metrics.ceiling.max_matched}.</p>
  <p>The retriever abstains on constructs the instrument does not measure: it rejected ${I.negatives_rejected} of ${I.n_negatives} held-out negatives on this fixture (AUROC ${I.auroc_absent_vs_present.toFixed(3)}). Its recall is an upper bound by construction, because the same generator family that wrote the training pairs wrote the fixture's queries after seeing the reference wording. Detecting its own wrong pick is a separate question: that figure was measured, then withdrawn from git, and this page cannot reproduce it.</p>
  <p>${provenanceLine()}</p>`;
}

/* The footer carries ONLY the provenance line, but under EVERY panel: live or
   committed, it says which. Scoping it to live panels left the committed ones
   with an empty footer, so a reader who loaded the page with a query prefilled
   saw a live-sounding masthead over a run committed days earlier and nothing
   that said so. Metrics closes with the same line in its own summary. */
function foot(){
  el("#foot").innerHTML=sel==="metrics"?"":`<p>${provenanceLine()}</p>`;
}

/* What the static page can and cannot do, said beside the controls that do it. */
function servedNote(){
  return window.COMPASS_ENDPOINT?""
    :"Served statically: the example runs and Search only work here. Ask the pipeline requires the live server, so that button is off.";
}

function panelPNG(){
  const panel=el("#panel"), rect=panel.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const css=[...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");
  const w=Math.ceil(rect.width), hgt=Math.ceil(panel.scrollHeight), o=Number();
  const svgNS="http://www.w3.org/2000/svg", xhtml="http://www.w3.org/1999/xhtml";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("xmlns",svgNS); svg.setAttribute("width",w); svg.setAttribute("height",hgt);
  const fo=document.createElementNS(svgNS,"foreignObject");
  fo.setAttribute("width",w); fo.setAttribute("height",hgt);
  const body=document.createElementNS(xhtml,"div");
  body.setAttribute("xmlns",xhtml);
  const style=document.createElementNS(xhtml,"style"); style.textContent=css; body.appendChild(style);
  const clone=panel.cloneNode(true); clone.setAttribute("style",`width:${w}px;background:#fff`);
  body.appendChild(clone); fo.appendChild(body); svg.appendChild(fo);
  const xml=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas"); c.width=w*dpr; c.height=hgt*dpr;
    const ctx=c.getContext("2d"); ctx.scale(dpr,dpr); ctx.fillStyle="#fff"; ctx.fillRect(o,o,w,hgt);
    ctx.drawImage(img,o,o);
    c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download=`compass_${sel}_${cur?cur.id:"none"}.png`;a.click();URL.revokeObjectURL(a.href);},"image/png");
  };
  img.onerror=()=>alert("The browser refused to rasterise the panel. The SVG route needs same-origin styles only, which this page has, so this is a browser limitation; download the page instead.");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);
}

/* Which branch `stagePanel` took. The footer closes by asserting that every
   figure on the page is loaded from a committed artifact; for a panel this
   endpoint produced moments ago that is simply untrue, and it is the sentence a
   reviewer would quote. Read only by `foot`. */
let panelLive=false;

/* Everything the reader is actually looking at, which is not always a committed
   example: after a live run `cur` is null. The download used to be
   `{stage, example: cur, provenance}` regardless, so a reviewer who had just
   watched a run finish got a file containing `"example": null` -- named
   `..._none.json`, under a button that says "Download this record" -- and
   nothing of the run itself. Whatever is on screen goes in. */
function panelRecord(){
  const doc={stage:sel};
  if(cur) doc.example=cur;
  if(posed) doc.posed_pair=posed;
  if(ask) doc.resolver=ask;
  if(live) doc.live_retrieval=live;
  if(spec) doc.specifier_run=spec;
  if(gen) doc.enumeration=gen;
  doc.artifact_provenance=Object.fromEntries(Object.entries(DATA)
    .filter(([k])=>k!=="index").map(([k,v])=>[k,v.provenance]));
  return doc;
}

/* True when there is something to download. The PNG button is NOT gated on
   this: a panel always renders something, and hiding a button that works would
   be the same defect pointed the other way. */
function panelHasRecord(){ return Boolean(cur||ask||live||posed||spec||gen); }

/* Both anchors as they were handed to the Specifier. Wording only if the
   endpoint supplied it: the committed artifact carries none, and an empty
   string must read as "withheld", never as a blank that looks like an answer. */
function posedPair(){
  const L=posed;
  const line=(role,key,text)=>`<div class="t"><span class="call">${role} &middot; <b>${esc(key)}</b></span>`
    +`<span class="ret">${text?esc(text):"wording withheld here"}</span></div>`;
  return `<div class="tools">`+line("exposure",L.exposure,L.exposure_text)
    +line("outcome",L.outcome,L.outcome_text)+`</div>`;
}

function posedRetrieverPanel(){
  return `<p class="sec">tool calls</p>`
   +`<div class="none">None. This run retrieved nothing.</div>`
   +`<p class="sec">output</p>`
   +`<div class="ph"><b>NO RETRIEVAL WAS RUN</b> &mdash; you posed this pair`
   +` directly from ${esc(posed.source_label)}, so the deployed retriever scored`
   +` no vectors. There is no cosine, threshold decision or abstention to show,`
   +` and this panel does not borrow them from another run.</div>`
   +`<p class="sec">what went to the Specifier instead</p>`+posedPair()
   +(posed.question?`<p class="sec">the question this pair stands for</p>`
     +`<div class="none">${esc(posed.question)}</div>`:``);
}

function posedIntakePanel(){
  /* Intake renders prose into a query. A posed pair arrives as two keys, so
     there is nothing to render -- and the identity is read off the run record
     once it lands rather than asserted here, because the endpoint is what
     decides it. */
  const id=(spec&&spec.identity)||null;
  return `<p class="sec">tool calls</p><div class="none">None.</div>`
   +`<p class="sec">output</p>`
   +`<div class="ph"><b>NO QUERY WAS RENDERED</b> &mdash; intake turns a request`
   +` into a query for the retriever. Both anchors arrived as keys, so intake had`
   +` nothing to render and nothing to drop as covered.</div>`
   +`<p class="sec">the pair</p>`+posedPair();
}

/* THE SPECIFIER TAB WAS A DEAD END when nothing had run: a dashed placeholder
   with no way to act, on the one stage a reader most wants to trigger. The
   capability already existed -- two keys in the search bar are pinned BY
   POSITION and start this stage with no retrieval and no language-model call
   (`serve/api.py::_pin_keys_from_prose`) -- but you had to know to type them,
   and the positional rule is only explained after the fact.

   TWO LABELLED FIELDS, not one box, and that is the whole gain: naming the role
   per field removes the ambiguity the prose path must warn about, where "is X
   predicted by Y" pins the OUTCOME as the exposure because direction is taken
   from position and never from grammar.

   Posts straight to `/api/specify`. The pair is already stated, so there is
   nothing to retrieve and nothing to infer, and going through `/api/pair` would
   spend a model call to learn what the reader just typed. */
/* The wording behind a proposed anchor, when a proposal has been made. A key
   on its own is unreadable -- which is the whole complaint this answers -- so
   the field is shown with the question it points at whenever that is known. */
function proposedWording(role){
  const v=ask&&ask.roles&&ask.roles[role]; if(!v) return "";
  if(v.verdict==="pinned") return v.pinned_wording||"";
  const pick=(v.candidates||[]).find(c=>c.proposed&&c.key);
  return pick?(pick.wording||""):"";
}

/* Roles the model would not commit to, rendered in full so the reader can act.
   Empty when both were adopted -- there is nothing to choose. */
function declinedRoles(){
  if(!ask||!ask.roles) return "";
  let h="";
  for(const role of ["exposure","outcome"]){
    const v=ask.roles[role];
    if(!v||v.verdict==="resolved"||v.verdict==="pinned") continue;
    h+=`<div class="none" style="color:var(--signal)">The language model did not`
      +` commit to an <b>${esc(role)}</b>, so the field is empty.`
      +` Pick a candidate below, or ask again with a more specific request.</div>`
      +roleBlock(role,v);
  }
  return h;
}

function askForm(){
  const busy=ask&&ask.running;
  /* LEADS WITH A QUESTION. This panel used to ask only for two variable keys,
     which is instrument content the page withholds -- so the field was a box a
     reader could not fill, and the advice was to go to another tab. Asking
     proposes the pair INTO the fields and leaves them visible with their
     wording, because the press of Run is the confirmation and confirming
     something unreadable is not confirming. */
  let h=`<p class="sec lead">ask for a pair</p>`
    +`<div class="none">Describe the association you want to study. Retrieval`
    +` offers candidate variables, a language model proposes the exposure and the`
    +` outcome, and both appear in the fields below for you to check. Nothing runs`
    +` until you press Run.</div>`
    +`<div class="pair">`
    +`<input id="spec-q" aria-label="what to measure"`
    +` value="${att((el("#q")&&el("#q").value)||"")}"`
    +` placeholder="does smoking cause hypertension">`
    +`</div>`
    +`<div class="after"><button class="g" id="spec-ask"${busy?" disabled":""}>`
    +`${busy?"proposing&hellip;":"Propose a pair"}</button></div>`;
  return h;
}

/* The operator's entry: a pair stated as two keys, for whoever has the
   codebook. Rendered only when no proposal exists -- a proposal shows its own
   roles, its own candidates and its own Run button, and a second set of both
   would leave the reader guessing which one runs. */
function keyForm(){
  const ew=proposedWording("exposure"), ow=proposedWording("outcome");
  let h=`<p class="sec lead">or state the pair yourself</p>`
    +`<div class="none">Each variable is one question in the codebook. Describe the`
    +` pair in words above, or enter an exposure key and an outcome key here. If no`
    +` key is identified, the model refuses to run.</div>`
    +`<div class="pair">`
    +`<input id="spec-ex" aria-label="exposure key" placeholder="exposure key"`
    +` value="${att(anchors.exposure||"")}">`
    +`<input id="spec-out" aria-label="outcome key" placeholder="outcome key"`
    +` value="${att(anchors.outcome||"")}">`
    +`</div>`
    +(ew||ow?`<div class="tools">`
      +`<div class="t"><span class="call">exposure &middot; ${esc(ew||"not proposed")}</span></div>`
      +`<div class="t"><span class="call">outcome &middot; ${esc(ow||"not proposed")}</span></div>`
      +`</div>`:"")
    +`<div class="after"><button class="g" id="spec-go">Run the Specifier</button></div>`
    /* A ROLE THE MODEL DECLINED IS THE MOST USEFUL THING ON THIS PANEL, and it
       was being thrown away. `adoptProposals` carries over only `resolved` and
       `pinned`, so an `ambiguous`, `absent`, `derive` or `family` verdict
       leaves the field empty -- correctly, since filling it would be picking
       one to be helpful. But the panel then said "not proposed" and stopped,
       hiding the reason AND `missing_dimension`, which is the sentence that
       says what would settle it. MEASURED on "does marijuana cause prostate
       cancer": retrieval put the exposure block in the pool at rank seven and
       the model answered `ambiguous`, naming six operationalisations and
       asking which is the primary exposure. That is an answer, not a failure,
       and the reader could not see it.

       `roleBlock` already renders the verdict, the reason, the missing
       dimension and every candidate with a `use` button wired by the handler
       below, so it is reused rather than reimplemented. */
    +declinedRoles()
    +`<div class="none">One run at a time: the server refuses a second run instead`
    +` of queuing it.</div>`;
  return h;
}

/* ASK IS ONE STOP, and it COMPOSES. `Specifier` was a second stop holding the
   run and, since the `record` fold, the record -- so the hypothesis, the
   analysis model and all four covariate blocks lived two clicks from the
   question that produced them. MEASURED from real job files: `/api/pair`
   returns no `question`, no `model_spec` and no covariates at all; they exist
   only in `/api/specify`'s record. So there was nothing to render on Ask and
   nothing to do but put the stages together.

   Concatenated, not selected: a reader who asks, proposes, runs and reads the
   record does all of it without moving, and every earlier branch of this
   function returned ONE panel, which is what split the arc in the first place. */
function askPanel(s){
  /* A posed pair has no retrieval and no question of its own, so it replaces
     the panel rather than stacking under it. */
  if(posed) return posedRetrieverPanel();
  let h="";
  /* THE FORM IS NEVER SHADOWED. The first version of this put the committed
     example ahead of the form, so with an example selected -- which is the
     page's state at load -- the stop rendered the example and the question box
     was unreachable. Caught by the endpoint harness, which reported none of
     the form's controls present. Whatever else is being shown, a served page
     can always be asked. */
  if(window.COMPASS_ENDPOINT) h+=askForm();
  /* A proposal renders its own roles and its own Run button; the key form is
     the entry for when there is no proposal. Never both. */
  if(ask) h+=resolverPanel();
  else if(window.COMPASS_ENDPOINT) h+=keyForm();
  if(spec) h+=specifierPanel();
  /* The committed and live halves, below whatever this session produced. Only
     when this session produced nothing: a stale example under a fresh run is
     the "answer a different run's numbers" defect `posed` exists to avoid. */
  if(!ask&&!spec){
    if(live) h+=livePanel();
    else if(typed!==null&&!cur) h+=noRun();
    else if(cur) h+=retrieverPanel();
  }
  return h||placeholder(s);
}

function stagePanel(s){
  panelLive=true;
  /* Before the committed branches: a posed run has no retrieval of its own, and
     falling through would show the previous one as if it were this one. */
  if(posed&&sel==="intake") return posedIntakePanel();
  if(sel==="ask") return askPanel(s);
  if((live||(ask&&ask.rendered_query))&&sel==="intake") return liveIntakePanel();
  if(sel==="generate"&&gen) return generatePanel();
  panelLive=false;
  /* Only the two stages a query feeds. This test used to sit above every
     committed branch, so one unrecognised query made Generate, Score and
     Metrics unreachable until a reload. */
  if(typed!==null&&!cur&&sel==="intake") return noRun();
  if(sel==="intake"&&cur) return intakePanel();
  if(sel==="generate") return generatePanel();
  if(sel==="score") return scorePanel();
  if(sel==="metrics") return metricsPanel();
  return placeholder(s);
}

function draw(){
  const s=DATA.stages.stages.find(x=>x.id===sel);
  let h=`<h2>${esc(s.name)}</h2><p class="sub">${esc(s.sub)}</p>
         <ul class="does">${s.does.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`;
  /* Contain a throwing panel. Everything below -- the assignment to #panel and
     every handler wired after it -- is downstream of this expression, so an
     exception here does not blank one panel, it leaves the PREVIOUS stage's DOM
     on screen with handlers still bound to a run that has moved on, and the rail
     stops responding. The realistic cause is a malformed endpoint reply: the
     committed artifacts pass site-check, an endpoint payload passes nothing.
     The message is safe to show -- the payload it came from was already through
     the server's scrubber and was about to be rendered into this same panel. */
  try{ h+=stagePanel(s); }
  catch(err){
    console.error("panel failed", sel, err);
    h+=`<div class="none"><b>This panel failed to render.</b> The rest of the
        page still works: pick another stage, or run the request again. The
        browser console shows the full error.<br><code>${esc(String(err&&err.message||err))}</code></div>`;
  }
  h+=`<div class="after">`
    +(panelHasRecord()?`<button class="g" id="dl-json">Download this record as JSON</button>`:"")
    +`<button class="g" id="png">Save panel as PNG</button></div>`;
  el("#panel").innerHTML=h;
  document.querySelectorAll("[data-anchor]").forEach(b=>b.onclick=()=>{
    anchors[b.dataset.anchor]=b.dataset.key; draw();});
  const go=el("#go-spec"); if(go) go.onclick=runSpecifier;
  const sa=el("#spec-ask");
  if(sa) sa.onclick=()=>{
    /* Mirrored into the main bar so there is ONE request on the page: the bar
       is what `askResolver` reads, and a reader who then looks up sees the
       question that was actually asked. */
    el("#q").value=el("#spec-q").value;
    askResolver(true);
  };
  const sg=el("#spec-go");
  if(sg) sg.onclick=()=>{
    /* Straight into the same `anchors` the resolver fills, so one code path
       runs the stage however the pair was arrived at. `runSpecifier` already
       returns early on a blank field, so an empty form is a no-op. */
    anchors.exposure=el("#spec-ex").value.trim()||null;
    anchors.outcome=el("#spec-out").value.trim()||null;
    runSpecifier();
  };
  /* Dead and silent was the worst moment on the published page: the darkest
     control did nothing. Off, with the reason beside it, when there is no
     server to ask. Re-read on every draw because the server sets the flag. */
  el("#ask").onclick=askResolver;
  el("#ask").disabled=!window.COMPASS_ENDPOINT;
  el("#served").textContent=servedNote();
  const gg=el("#go-gen"); if(gg) gg.onclick=enumerate;
  document.querySelectorAll("[data-genex]").forEach(b=>b.onclick=()=>{
    anchors.exposure=b.dataset.genex; anchors.outcome=b.dataset.genout;
    /* A run already holds the lock: `runSpecifier` would return in silence and
       the click would look broken. Show the run that is blocking instead. */
    if(specBusy){ navGen={}; sel="specifier"; draw(); return; }
    const L=launchable[b.dataset.launch];
    posed=L||{source:"unknown",source_label:"a pair chosen on this page",
              id:"", exposure:b.dataset.genex, outcome:b.dataset.genout,
              exposure_text:"", outcome_text:"", question:""};
    /* The previous request's retrieval is not this run's evidence. */
    live=null; ask=null; cur=null; typed=null;
    runSpecifier();});
  const dj=el("#dl-json"); if(dj) dj.onclick=()=>{
    const doc=panelRecord();
    const b=new Blob([JSON.stringify(doc,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);
    /* Named for what it holds. `cur` alone put `_none` on a file full of run. */
    a.download=`compass_${sel}_${cur?cur.id:(spec?"live_run":"live")}.json`;
    a.click();URL.revokeObjectURL(a.href);};
  el("#png").onclick=panelPNG;
  /* The rail reports live state and marks the current stage, so it is rebuilt
     with the panel rather than once at load. */
  rail();
  /* After the panel, not before: `foot` reads `panelLive`, which `stagePanel` set. */
  foot();
}

el("#run").onclick=async()=>{
  const q=el("#q").value.trim(); if(!q)return;
  const gen=(liveGen={}), nav=(navGen={});
  live=null; ask=null; posed=null; cur=match(q); typed=cur?null:q;
  /* Draw the committed answer first, so the page never blocks on a network
     call that will usually not be there, then upgrade if the endpoint replies. */
  draw();
  if(cur) return;
  const j=await liveRetrieve(q);
  if(gen!==liveGen) return;
  /* Only pull the reader to the retriever if they are not deliberately
     somewhere else: a reply arriving while they read another stage should not
     move them. */
  if(j){ live=j; if(sel!=="specifier") steer(nav,"ask"); draw(); }
};
/* Enter is the reader's first action; without this it did nothing. */
el("#q").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); el("#run").onclick(); } };
el("#dl-src").onclick=()=>{
  /* One self-contained file: the live DOM as rendered, plus every loaded
     artifact embedded as JSON so load() needs no fetch when opened from disk. */
  const root=document.documentElement.cloneNode(true);
  const old=root.querySelector("#embedded-artifacts"); if(old) old.remove();
  const emb=document.createElement("script");
  emb.type="application/json"; emb.id="embedded-artifacts";
  emb.textContent=JSON.stringify(DATA).replace(/<\//g,"<\\/");
  root.querySelector("head").appendChild(emb);
  const b=new Blob(["<!DOCTYPE html>\n"+root.outerHTML],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="compass-tool-page.html";a.click();URL.revokeObjectURL(a.href);};

load().then(()=>{const [first]=DATA.runs.examples; cur=first; el("#q").value=cur.request.text; examples(); rail(); draw(); foot();}).catch(e=>{
  el("#panel").innerHTML=`<h2>Artifacts did not load</h2><div class="ph"><b>NO DATA</b> — ${esc(e.message)}. Serve this directory over HTTP; a file:// open cannot fetch the artifacts.</div>`;
});
</script>
</body>
</html>
