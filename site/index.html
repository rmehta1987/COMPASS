<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMPASS — survey variable retrieval and study design</title>
<style>
  :root{
    --ground:#EDF0F2; --paper:#F7F9FA; --ink:#16232E; --ink-2:#4A5C69; --ink-3:#7A8B97;
    --rule:#C3CDD4; --rule-2:#DCE3E7; --signal:#A8621B; --ok:#2C5A4E;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--sans)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  header{border-bottom:2px solid var(--ink)}
  .mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;padding:30px 0 18px}
  h1{font-size:clamp(27px,3.8vw,40px);line-height:1.03;letter-spacing:-.025em;font-weight:640;margin:0}
  h1 span{display:block;font-family:var(--mono);font-size:.36em;font-weight:400;color:var(--ink-2);
    margin-top:11px;line-height:1.5;max-width:62ch;letter-spacing:.01em}
  .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
  .links a,.links button{color:var(--ink);text-decoration:none;border:1px solid var(--rule);background:var(--paper);padding:7px 12px;font:inherit;cursor:pointer}
  .links a:hover,.links a:focus-visible,.links button:hover,.links button:focus-visible{border-color:var(--ink)}

  .bar{border-bottom:1px solid var(--rule);background:var(--paper)}
  .bar .wrap{display:flex;gap:12px;align-items:center;padding:13px 24px;flex-wrap:wrap}
  .bar input{flex:1 1 340px;min-width:0;font:400 15px var(--sans);color:var(--ink);
    background:#fff;border:1px solid var(--rule);padding:10px 12px}
  .bar input:focus-visible{outline:2px solid var(--ink);outline-offset:-1px}
  button{font:500 14px var(--sans);color:var(--paper);background:var(--ink);
    border:1px solid var(--ink);padding:10px 18px;cursor:pointer}
  button.g{color:var(--ink);background:transparent}
  button:hover{opacity:.87} button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .bar .ex{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px}
  .bar .ex button{padding:6px 9px;font-family:var(--mono);font-size:11.5px}

  .stage{display:grid;grid-template-columns:236px minmax(0,1fr);border:1px solid var(--rule);
    background:var(--paper);margin:28px 0 0}
  .rail{border-right:1px solid var(--rule)}
  .rail button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);
    border:0;border-bottom:1px solid var(--rule-2);padding:13px 16px;cursor:pointer;font:400 14px var(--sans)}
  .rail button:hover{background:#fff}
  .rail button[aria-current="true"]{background:#fff;box-shadow:inset 3px 0 0 var(--ink);font-weight:600}
  .rail .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-right:8px}
  .rail .st{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;margin-top:3px}
  .st.shipped{color:var(--ok)} .st.built{color:var(--ink-3)} .st.blocked{color:var(--signal)}

  .panel{padding:22px 24px 26px;background:#fff}
  .panel h2{font-size:23px;margin:0 0 3px;letter-spacing:-.012em}
  .panel .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin:0 0 18px}
  .does{margin:0 0 22px;padding:0;list-style:none;font-size:14.5px}
  .does li{padding:5px 0 5px 16px;position:relative;color:var(--ink-2)}
  .does li:before{content:"";position:absolute;left:0;top:13px;width:6px;height:1px;background:var(--ink-3)}

  .sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);
    border-bottom:1px solid var(--ink);padding-bottom:6px;margin:0 0 12px}
  .sec+.sec{margin-top:26px}

  .tools{border:1px solid var(--rule);margin:0 0 26px;font-family:var(--mono);font-size:12.5px}
  .tools .t{border-bottom:1px solid var(--rule-2);padding:9px 12px}
  .tools .t:last-child{border-bottom:0}
  .tools .call{color:var(--ink)}
  .tools .call b{font-weight:600}
  .tools .ret{color:var(--ink-2);padding-left:16px;margin-top:4px;display:block}
  .tools .ret.no{color:var(--signal)}
  .tools .gate{background:var(--ground);color:var(--ink-2);font-size:11.5px}
  .tools .gate.pass{box-shadow:inset 3px 0 0 var(--ok)}
  .tools .gate.fail{box-shadow:inset 3px 0 0 var(--signal)}
  .none{border:1px solid var(--rule);padding:14px 12px;margin:0 0 26px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
  .ph{border:1px dashed var(--signal);padding:14px 12px;margin:0 0 26px;
    font-family:var(--mono);font-size:12.5px;color:var(--signal)}
  .ph b{letter-spacing:.06em}

  dl{margin:0 0 26px;display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--rule)}
  dt,dd{margin:0;padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:14px}
  dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--paper)}
  dd.m{font-family:var(--mono);font-size:12.5px;word-break:break-word}
  dl>:nth-last-child(-n+2){border-bottom:0}
  .flag{color:var(--signal);font-weight:600}
  .good{color:var(--ok);font-weight:600}
  .after{display:flex;gap:8px;flex-wrap:wrap}
  .after button{font-family:var(--mono);font-size:12px;padding:8px 12px}

  .measure{margin:34px 0 0}
  .measure h2{font-size:20px;margin:0 0 4px;letter-spacing:-.012em}
  .measure p.lead{margin:0 0 16px;font-size:14px;color:var(--ink-2);max-width:82ch}
  .tbl{overflow-x:auto;border:1px solid var(--rule);background:#fff;margin:0 0 18px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:8px 12px;border-bottom:1px solid var(--rule-2);text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
  th{font-weight:600;color:var(--ink-2);background:var(--paper);letter-spacing:.03em;font-size:11px}
  td:first-child,th:first-child{text-align:left;font-family:var(--sans);font-size:13.5px}
  tr:last-child td{border-bottom:0}
  td.hi{font-weight:600}
  .prov{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:-8px 0 18px}
  footer{border-top:1px solid var(--rule);margin-top:34px;padding:20px 0 54px;font-size:13px;color:var(--ink-2)}
  footer p{margin:0 0 7px;max-width:82ch}
  @media (max-width:820px){
    .stage{grid-template-columns:1fr}
    .rail{border-right:0;border-bottom:1px solid var(--rule);display:flex;overflow-x:auto}
    .rail button{border-bottom:0;border-right:1px solid var(--rule-2);white-space:nowrap;width:auto}
    dl{grid-template-columns:120px minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap mast">
  <h1>COMPASS<span>Type what you want to measure. Watch each stage retrieve, refuse, or block — with the tool calls it made.</span></h1>
  <nav class="links"><button class="g" id="dl-src">Download this page</button><a href="https://github.com/rmehta1987/COMPASS">Repo</a></nav>
</div></header>

<div class="bar"><div class="wrap">
  <input id="q" value="" aria-label="request" placeholder="a construct you want to measure">
  <button id="ask" class="g">Ask the model</button><button id="run">Run</button>
  <span class="ex" id="examples"></span>
</div></div>

<main class="wrap">
  <div class="stage">
    <nav class="rail" id="rail" aria-label="pipeline stage"></nav>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
  <section class="measure" id="measure" aria-label="measurements"></section>
  <footer id="foot"></footer>
</main>

<script>
/* Nothing on this page is typed in. Every stage description, run, record and
   figure is fetched from site/artefacts/*.json, each carrying its provenance.
   site-check.sh fails the build if a numeric literal appears here. */
const DATA={};
let sel="retriever", cur=null, typed=null;
const el=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const row=(k,v,m)=>`<dt>${k}</dt><dd class="${m?'m':''}">${v}</dd>`;
const f4=x=>x.toFixed(4);

async function load(){
  const emb=document.getElementById("embedded-artefacts");
  if(emb){Object.assign(DATA,JSON.parse(emb.textContent));return;}
  const idx=await (await fetch("artefacts/index.json")).json();
  DATA.index=idx;
  for(const f of idx.files){
    DATA[f.replace(/\.json$/,"")]=await (await fetch("artefacts/"+f)).json();
  }
}

function rail(){
  el("#rail").innerHTML=DATA.stages.stages.map((s,i)=>
    `<button data-s="${s.id}" aria-current="${s.id===sel}">
      <span class="n">${i+1}</span>${esc(s.name)}
      <span class="st ${esc(s.status)}">${esc(s.status_label)}</span></button>`).join("");
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel=b.dataset.s;draw();});
}

function examples(){
  el("#examples").innerHTML=DATA.runs.examples.map((e,i)=>
    `<button class="g" data-ex="${i}">${esc(e.label)}</button>`).join("");
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{
    cur=DATA.runs.examples[+b.dataset.ex]; typed=null; live=null; liveGen={};
    el("#q").value=cur.request.text; draw();});
}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean).join(" ");
function match(q){
  const n=norm(q);
  return DATA.runs.examples.find(e=>norm(e.request.text)===n||norm(e.rendered_query)===n)||null;
}

function placeholder(s){
  return `<p class="sec">output</p><div class="ph"><b>PLACEHOLDER</b> — no committed artefact yet. ${esc(s.placeholder)}`
    +(s.waits_for?` Waits for ${esc(s.waits_for)}.`:"")+`</div>`;
}
/* Live retrieval, used only when this page is being SERVED BY serve/api.py.
   Same origin, so there is no host in the URL and no CORS: the offline gate
   forbids a host precisely because an external request is what this page must
   never make, and a same-origin call the reader triggers is not one. Opened
   from GitHub Pages or from file:// there is no /api, the fetch fails, and
   everything below falls back to the committed runs exactly as before. The
   endpoint answers with whatever IT was started with -- pseudonyms by default,
   wording under --show-instrument -- so this renders what it is given and
   claims nothing about which. */
let live=null, ask=null;

async function askResolver(){
  if(!window.COMPASS_ENDPOINT) return;
  const q=el("#q").value.trim(); if(!q) return;
  const gen=(liveGen={});
  live=null; cur=null; typed=null; ask={running:true}; sel="retriever"; draw();
  try{
    const r=await fetch("/api/pair",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({request:q})});
    const j=await r.json().catch(()=>null);
    if(!j||typeof j!=="object"){ ask={error:`the endpoint answered ${r.status}`}; return; }
    if(!j.ticket){ ask=j; return; }
    for(;;){
      await new Promise(done=>setTimeout(done,j.poll_after_ms));
      if(gen!==liveGen) return;
      const s2=await fetch("/api/specify/status",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ticket:j.ticket})});
      const u=await s2.json().catch(()=>null);
      if(!u||typeof u!=="object"){ ask={error:`the endpoint answered ${s2.status}`}; return; }
      if(u.status==="running"){ ask={running:true,elapsed_s:u.elapsed_s}; draw(); continue; }
      ask=u; adoptProposals(u);
      /* Keys in, design out. Nothing was inferred, so there is nothing to
         confirm -- see adoptProposals for where that line is drawn. */
      if(allPinned(u)){ draw(); runSpecifier(); return; }
      return;
    }
  }catch(err){ ask={error:"the endpoint did not answer"}; }
  finally{ draw(); }
}

function allPinned(j){
  /* True only when BOTH anchors came from keys in the request. A `resolved`
     verdict is the model's judgement and still gets a look before it runs. */
  if(!j||!j.roles) return false;
  return ["exposure","outcome"].every(r=>
    j.roles[r]&&j.roles[r].verdict==="pinned"&&j.roles[r].pinned_key);
}

function adoptProposals(j){
  /* Carry over only what the model COMMITTED to. `resolved` and `pinned` are
     answers; `ambiguous`, `absent`, `derive` and `family` are it declining, and
     filling those would pick one to be helpful -- the exact move the retrieval
     guidance forbids. The reader still presses Run, which is the confirmation. */
  if(!j||!j.roles) return;
  for(const role of ["exposure","outcome"]){
    const v=j.roles[role]; if(!v) continue;
    if(v.verdict==="pinned"&&v.pinned_key){ anchors[role]=v.pinned_key; continue; }
    if(v.verdict!=="resolved") continue;
    const pick=(v.candidates||[]).find(c=>c.proposed&&c.key);
    if(pick) anchors[role]=pick.key;
  }
}

function roleBlock(role,v){
  let h=`<p class="sec">${role} &middot; <b>${esc(v.verdict)}</b></p>`;
  if(v.verdict==="pinned") return h+`<div class="tools"><div class="t gate pass">`
    +`<span class="call"><b>${esc(v.pinned_key||"")}</b> ${esc(v.pinned_wording||"")}</span>`
    +`<span class="ret">named in the request &mdash; not inferred</span></div></div>`;
  if(v.reason) h+=`<div class="none">${esc(v.reason)}</div>`;
  if(v.missing_dimension) h+=`<div class="none" style="color:var(--signal)">`
    +`what would settle it: ${esc(v.missing_dimension)}</div>`;
  h+=`<div class="tools">`+v.candidates.map(c=>
      `<div class="t${c.proposed?" gate pass":""}"><span class="call">`
      +`${c.proposed?"&#10003; ":""}${c.index}. <b>${esc(c.key||"")}</b> ${esc(c.wording)}</span>`
      +`<span class="ret">cos ${f4(c.cos)}</span>`
      +(c.key?`<button class="g pick" data-anchor="${role}" data-key="${esc(c.key)}">use</button>`:"")
      +`</div>`).join("")+`</div>`;
  return h;
}

function resolverPanel(){
  const j=ask;
  if(j.running) return `<p class="sec">asking the model</p><div class="ph"><b>IN PROGRESS</b>`
    +`${typeof j.elapsed_s==="number"?` &mdash; ${j.elapsed_s}s`:""} &mdash; the model reads`
    +` your request and the candidate list and selects by index. The harness resolves`
    +` the index, so it never emits a key.</div>`;
  if(j.error) return `<p class="sec">output</p><div class="ph"><b>NO ANSWER</b> &mdash; ${esc(j.error)}</div>`;
  let h=`<p class="sec">prose resolver &middot; ${esc(j.model_id)} &middot; not a committed run</p><dl>`
    +row("request",esc(j.request))
    +row("proposed by",esc(j.anchors_proposed_by),true)
    +`</dl>`;
  for(const role of ["exposure","outcome"]) if(j.roles&&j.roles[role]) h+=roleBlock(role,j.roles[role]);
  const declined=["exposure","outcome"].filter(r=>j.roles&&j.roles[r]
    &&j.roles[r].verdict!=="resolved"&&j.roles[r].verdict!=="pinned");
  h+=`<p class="sec">chosen pair</p>`
    +(allPinned(j)?`<div class="none" style="color:var(--signal)">`
      +`Both anchors were named in the request, so nothing was inferred and the`
      +` Specifier started automatically.</div>`:"")
    +(declined.length?`<div class="none" style="color:var(--signal)">`
      +`The model declined to choose the ${esc(declined.join(" and "))}, so nothing`
      +` was filled in there. Pick one yourself, or ask again more specifically.</div>`
      :`<div class="none">Filled from what the model committed to. Change either`
      +` before running.</div>`)
    +`<dl>`
    +row("exposure",anchors.exposure?esc(anchors.exposure):"<em>none picked</em>",true)
    +row("outcome",anchors.outcome?esc(anchors.outcome):"<em>none picked</em>",true)
    +`</dl>`
    +(anchors.exposure&&anchors.outcome
      ?`<div class="after"><button class="g" id="go-spec">Run the Specifier on this pair</button></div>`
      :"");
  h+=`<div class="none" style="color:var(--signal)">${esc(j.not_a_selection)}</div>`;
  return h;
}

/* The pair the reader assembled, and the last Specifier answer. Both live
   alongside `live` rather than inside it: a run outlives the retrieval that
   suggested its anchors. */
const anchors={exposure:null,outcome:null};
let spec=null, specBusy=false;

async function runSpecifier(){
  if(!window.COMPASS_ENDPOINT||specBusy) return;
  if(!anchors.exposure||!anchors.outcome) return;
  specBusy=true; spec={running:true}; sel="specifier"; draw();
  try{
    const r=await fetch("/api/specify",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({exposure:anchors.exposure,outcome:anchors.outcome})});
    const j=await r.json().catch(()=>null);
    /* A refusal, a busy answer while another run holds the lock, and a
       bad-request for an unresolvable key are all ANSWERS, not failures:
       show what came back rather than collapsing them into "no endpoint". */
    if(!j||typeof j!=="object"){ spec={error:`the endpoint answered ${r.status}`}; return; }
    if(!j.ticket){ spec=j; return; }
    /* A RUN OUTLIVES ANY ONE REQUEST. Held open, the POST hit Cloudflare's
       proxy ceiling and died with a gateway timeout while the run itself
       carried on happily to completion. So the POST hands back a ticket and
       we ask again on the interval the server names: the page states no
       number of its own. */
    spec={running:true,ticket:j.ticket}; draw();
    for(;;){
      await new Promise(done=>setTimeout(done,j.poll_after_ms));
      const q=await fetch("/api/specify/status",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ticket:j.ticket})});
      const u=await q.json().catch(()=>null);
      if(!u||typeof u!=="object"){ spec={error:`the endpoint answered ${q.status}`}; return; }
      if(u.status==="running"){ spec={running:true,ticket:j.ticket,elapsed_s:u.elapsed_s}; draw(); continue; }
      spec=u; return;
    }
  }catch(err){
    spec={error:"the endpoint did not answer"};
  }finally{ specBusy=false; draw(); }
}

function anchorLine(a){
  /* Exposure and outcome are a union: a variable reference, a derivation, or a
     roster family. Show whichever arrived rather than assuming a key. */
  if(!a) return "<em>none</em>";
  const wording=a.quoted_wording?` &mdash; ${esc(a.quoted_wording)}`:"";
  return `<b>${esc(a.key||a.derivation_id||a.group_key||a.kind||"")}</b>${wording}`;
}

function covBlock(title,list,note){
  if(!list||!list.length) return `<p class="sec">${title}</p><div class="none">${note}</div>`;
  return `<p class="sec">${title} &middot; ${list.length}</p><div class="tools">`
    +list.map(c=>`<div class="t"><span class="call"><b>${esc(c.variable&&(c.variable.key||c.variable.derivation_id)||"")}</b>`
      +` &middot; ${esc(c.role||"")}${c.contestable?" &middot; contestable":""}</span>`
      +`<span class="ret">${esc(c.mechanism||c.justification||"")}</span></div>`).join("")
    +`</div>`;
}

function readableProtocol(r){
  const m=r.model_spec||{}, e=r.estimability||{}, a=r.access||{}, ft=r.falsifier_threshold;
  let h=`<dl>`
    +row("question",esc(r.question))
    +row("expected direction",(function(d){
        /* A structured type, not a string: direction plus an optional magnitude
           and where that magnitude came from. Rendered as `[object Object]`
           until this was checked against a real record. */
        if(!d) return "<em>none</em>";
        const mag=d.magnitude===null||d.magnitude===undefined?"":
          ` &middot; ${esc(String(d.magnitude))}`
          +(d.magnitude_source?` (${esc(d.magnitude_source)})`:"");
        return `${esc(d.direction||"")}${mag}`;
      })(r.expected_direction),true)
    +row("exposure",anchorLine(r.exposure),true)
    +row("outcome",anchorLine(r.outcome),true)
    +row("model",`${esc(m.form||"")} &middot; per ${esc(m.unit_of_analysis||"")}`
        +(m.clustering?` &middot; clustered on ${esc(m.clustering)}`:""),true)
    +row("falsifier",esc(r.falsifier))
    +(ft?row("threshold",`${esc(String(ft.comparator||""))} ${esc(String(ft.value))} `
        +`${esc(ft.unit||"")}`,true):"")
    +`</dl>`;
  h+=covBlock("adjusted",r.adjusted_covariates,"none");
  h+=covBlock("excluded on purpose",r.excluded_variables,
              "none &mdash; an empty exclusion list is rejected by the schema");
  h+=covBlock("undetermined",r.undetermined_covariates,"none");
  if(r.sought_covariates&&r.sought_covariates.length)
    h+=`<p class="sec">looked for and not found &middot; ${r.sought_covariates.length}</p>`
      +`<div class="tools">`+r.sought_covariates.map(u=>
        `<div class="t"><span class="call"><b>${esc(u.construct_sought||"")}</b></span>`
        +`<span class="ret">${esc(u.exposes_the_estimate_to||u.why_rejected||"")}</span></div>`
        +(u.search_phrases&&u.search_phrases.length
          ?`<div class="t"><span class="call">tried: ${esc(u.search_phrases.join(" &middot; "))}</span></div>`:"")
      ).join("")+`</div>`;
  h+=`<p class="sec">estimability</p><dl>`
    +row("analytic n",e.analytic_n===null||e.analytic_n===undefined
        ?`<span class="flag">unknown</span> &middot; ${esc(e.n_source||"")}`
        :`${esc(String(e.analytic_n))} &middot; ${esc(e.n_source||"")}`,true)
    +row("modules required",esc((e.modules_required||[]).join(", ")),true)
    +(e.exposure_contrast?row("contrast",esc(e.exposure_contrast)):"")
    +row("access",esc(a.decision||""),true)
    +`</dl>`;
  h+=`<p class="sec">status</p><div class="tools">`
    +`<div class="t gate ${(r.blocked_on||[]).length?"fail":"pass"}"><span class="call">`
    +`<b>${esc(r.status||"")}</b></span><span class="ret">`

    ).join("")+`</div>`;
  }
  const rec=j.selected||j.refusal;
  if(rec){
    h+=`<p class="sec">${j.selected?"selected protocol":"refusal, upheld by the environment"}</p>`
      +(j.selected?readableProtocol(rec):readableRefusal(rec))
      +`<details><summary>the record as JSON &middot; provenance</summary>`
      +`<pre class="rec">${esc(JSON.stringify(rec,null,2))}</pre></details>`;
  }else{
    h+=`<p class="sec">output</p><div class="ph"><b>NO RECORD</b> &mdash; ${esc(j.reason||"the run produced neither a protocol nor a refusal")}</div>`;
    /* A rejected design is still a design. The sample kept it, so show it: a
       run can spend ten minutes and dozens of tool calls building one, and it
       is worth reading and scoring even when the gate refused to authorise it.
       The gate's verdict stands; this only stops it being invisible. */
    for(const a of (j.samples||[])){
      if(a.rejected_record) h+=`<p class="sec">the design the gate rejected &middot; seed ${a.seed}</p>`
        +(typeof a.rejected_record==="object"&&a.rejected_record.question
          ?readableProtocol(a.rejected_record):"")
        +`<details><summary>as JSON &middot; provenance</summary><pre class="rec">`
        +`${esc(typeof a.rejected_record==="string"?a.rejected_record:JSON.stringify(a.rejected_record,null,2))}`
        +`</pre></details>`;
      if(a.analysis) h+=`<p class="sec">what the model established &middot; seed ${a.seed}</p>`
        +`<details><summary>the reasoning, in full</summary>`
        +`<pre class="rec">${esc(a.analysis)}</pre></details>`;
    }
  }
  if(j.not_a_measurement) h+=`<div class="none" style="color:var(--signal)">${esc(j.not_a_measurement)}</div>`;
  return h;
}

/* Every request that can change the panel takes a ticket. An await
   suspends, and the reader keeps clicking: without this, a slow live
   reply lands after they picked an example and paints over it. */
let liveGen=null;
async function liveRetrieve(q){
  /* INERT unless the endpoint said so. On GitHub Pages a root-relative
     "/api/retrieve" does NOT fail: it resolves against the Pages origin, the
     POST leaves the browser carrying what the reader typed, and a not-found
     answer comes back. The offline gate certifies "zero external requests" and cannot see
     a hostless URL, so the page must be unable to make that request at all --
     not merely handle its failure. Only the server can honestly claim to be
     the server, so it sets the flag when it serves this file. */
  if(!window.COMPASS_ENDPOINT) return null;
  try{
    const r=await fetch("/api/retrieve",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query:q})});
    if(!r.ok) return null;
    const j=await r.json();
    return (j&&Array.isArray(j.hits)&&j.hits.length)?j:null;
  }catch(err){ return null; }
}

function anchorOf(v){
  /* Whatever the pair route settled on for a role, however it got there. */
  if(!v) return null;
  if(v.verdict==="pinned"&&v.pinned_key)
    return {key:v.pinned_key,wording:v.pinned_wording,how:"named in the request"};
  const pick=(v.candidates||[]).find(c=>c.proposed&&c.key);
  if(pick&&v.verdict==="resolved")
    return {key:pick.key,wording:pick.wording,how:"chosen by the model"};
  // No entity inside a string that `esc` will escape: it would render the
  // entity's own source text. Plain words only in here.
  return {key:null,wording:null,how:`not settled: ${v.verdict}`};
}

function liveIntakePanel(){
  /* A pair is a different object from a single retrieval: one prose request,
     one pool query, two anchors. Rendering it through the RetrievalRequest

  if(!live&&ask&&ask.rendered_query) return pairIntakePanel();

  let h=`<p class="sec">tool calls</p><div class="none">None. The template is `

  const dpr=window.devicePixelRatio||1;
  const css=[...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");
  const w=Math.ceil(rect.width), hgt=Math.ceil(panel.scrollHeight), o=Number();
  const svgNS="http://www.w3.org/2000/svg", xhtml="http://www.w3.org/1999/xhtml";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("xmlns",svgNS); svg.setAttribute("width",w); svg.setAttribute("height",hgt);
  const fo=document.createElementNS(svgNS,"foreignObject");
  fo.setAttribute("width",w); fo.setAttribute("height",hgt);
  const body=document.createElementNS(xhtml,"div");
  body.setAttribute("xmlns",xhtml);
  const style=document.createElementNS(xhtml,"style"); style.textContent=css; body.appendChild(style);
  const clone=panel.cloneNode(true); clone.setAttribute("style",`width:${w}px;background:#fff`);
  body.appendChild(clone); fo.appendChild(body); svg.appendChild(fo);
  const xml=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas"); c.width=w*dpr; c.height=hgt*dpr;
    const ctx=c.getContext("2d"); ctx.scale(dpr,dpr); ctx.fillStyle="#fff"; ctx.fillRect(o,o,w,hgt);
    ctx.drawImage(img,o,o);
    c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download=`compass_${sel}_${cur?cur.id:"none"}.png`;a.click();URL.revokeObjectURL(a.href);},"image/png");
  };
  img.onerror=()=>alert("The browser refused to rasterise the panel. The SVG route needs same-origin styles only, which this page has, so this is a browser limitation; download the page instead.");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);
}

function draw(){
  const s=DATA.stages.stages.find(x=>x.id===sel);
  let h=`<h2>${esc(s.name)}</h2><p class="sub">${esc(s.sub)}</p>
         <ul class="does">${s.does.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`;
  if(spec&&sel==="specifier") h+=specifierPanel();
  else if(ask&&sel==="retriever") h+=resolverPanel();
  else if(live&&sel==="retriever") h+=livePanel();
  else if((live||(ask&&ask.rendered_query))&&sel==="intake") h+=liveIntakePanel();
  else if(typed!==null&&!cur) h+=noRun();
  else if(sel==="retriever"&&cur) h+=retrieverPanel();
  else if(sel==="intake"&&cur) h+=intakePanel();
  else if(sel==="funnel") h+=funnelPanel();
  else if(sel==="score") h+=scorePanel();
  else h+=placeholder(s);
  h+=`<div class="after"><button class="g" id="dl-json">Download this record as JSON</button><button class="g" id="png">Save panel as PNG</button></div>`;
  el("#panel").innerHTML=h;
  document.querySelectorAll("[data-anchor]").forEach(b=>b.onclick=()=>{
    anchors[b.dataset.anchor]=b.dataset.key; draw();});
  const go=el("#go-spec"); if(go) go.onclick=runSpecifier;
  el("#ask").onclick=askResolver;
  el("#dl-json").onclick=()=>{
    const doc={stage:sel,example:cur,artefact_provenance:Object.fromEntries(Object.entries(DATA).filter(([k])=>k!=="index").map(([k,v])=>[k,v.provenance]))};
    const b=new Blob([JSON.stringify(doc,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download=`compass_${sel}_${cur?cur.id:"none"}.json`;a.click();URL.revokeObjectURL(a.href);};
  el("#png").onclick=panelPNG;
}

el("#run").onclick=async()=>{
  const q=el("#q").value.trim(); if(!q)return;
  const gen=(liveGen={});
  live=null; ask=null; cur=match(q); typed=cur?null:q;
  /* Draw the committed answer first, so the page never blocks on a network
     call that will usually not be there, then upgrade if the endpoint replies. */
  draw();
  if(cur) return;
  const j=await liveRetrieve(q);
  if(gen!==liveGen) return;
  /* Only pull the reader to the retriever if they are not deliberately
     somewhere else: a reply arriving while they read another stage should not
     move them. */
  if(j){ live=j; if(sel!=="specifier") sel="retriever"; draw(); }
};
el("#dl-src").onclick=()=>{
  /* One self-contained file: the live DOM as rendered, plus every loaded
     artefact embedded as JSON so load() needs no fetch when opened from disk. */
  const root=document.documentElement.cloneNode(true);
  const old=root.querySelector("#embedded-artefacts"); if(old) old.remove();
  const emb=document.createElement("script");
  emb.type="application/json"; emb.id="embedded-artefacts";
  emb.textContent=JSON.stringify(DATA).replace(/<\//g,"<\\/");
  root.querySelector("head").appendChild(emb);
  const b=new Blob(["<!DOCTYPE html>\n"+root.outerHTML],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="compass-tool-page.html";a.click();URL.revokeObjectURL(a.href);};

load().then(()=>{const [first]=DATA.runs.examples; cur=first; el("#q").value=cur.request.text; examples(); rail(); draw(); measure();}).catch(e=>{
  el("#panel").innerHTML=`<h2>Artefacts did not load</h2><div class="ph"><b>NO DATA</b> — ${esc(e.message)}. Serve this directory over HTTP; a file:// open cannot fetch the artefacts.</div>`;
});
</script>
</body>
</html>
