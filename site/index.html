<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMPASS — survey variable retrieval and study design</title>
<style>
  :root{
    --ground:#EDF0F2; --paper:#F7F9FA; --ink:#16232E; --ink-2:#4A5C69; --ink-3:#7A8B97;
    --rule:#C3CDD4; --rule-2:#DCE3E7; --signal:#A8621B; --ok:#2C5A4E;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--sans)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  header{border-bottom:2px solid var(--ink)}
  .mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;padding:30px 0 18px}
  h1{font-size:clamp(27px,3.8vw,40px);line-height:1.03;letter-spacing:-.025em;font-weight:640;margin:0}
  h1 span{display:block;font-family:var(--mono);font-size:.36em;font-weight:400;color:var(--ink-2);
    margin-top:11px;line-height:1.5;max-width:62ch;letter-spacing:.01em}
  .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
  .links a,.links button{color:var(--ink);text-decoration:none;border:1px solid var(--rule);background:var(--paper);padding:7px 12px;font:inherit;cursor:pointer}
  .links a:hover,.links a:focus-visible,.links button:hover,.links button:focus-visible{border-color:var(--ink)}

  .bar{border-bottom:1px solid var(--rule);background:var(--paper)}
  .bar .wrap{display:flex;gap:12px;align-items:center;padding:13px 24px;flex-wrap:wrap}
  .bar input{flex:1 1 340px;min-width:0;font:400 15px var(--sans);color:var(--ink);
    background:#fff;border:1px solid var(--rule);padding:10px 12px}
  .bar input:focus-visible{outline:2px solid var(--ink);outline-offset:-1px}
  button{font:500 14px var(--sans);color:var(--paper);background:var(--ink);
    border:1px solid var(--ink);padding:10px 18px;cursor:pointer}
  button.g{color:var(--ink);background:transparent}
  button:hover{opacity:.87} button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .bar .ex{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px}
  .bar .ex button{padding:6px 9px;font-family:var(--mono);font-size:11.5px}

  .stage{display:grid;grid-template-columns:236px minmax(0,1fr);border:1px solid var(--rule);
    background:var(--paper);margin:28px 0 0}
  .rail{border-right:1px solid var(--rule)}
  .rail button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);
    border:0;border-bottom:1px solid var(--rule-2);padding:13px 16px;cursor:pointer;font:400 14px var(--sans)}
  .rail button:hover{background:#fff}
  .rail button[aria-current="true"]{background:#fff;box-shadow:inset 3px 0 0 var(--ink);font-weight:600}
  .rail .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-right:8px}
  .rail .st{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;margin-top:3px}
  .st.shipped{color:var(--ok)} .st.built{color:var(--ink-3)} .st.blocked{color:var(--signal)}

  .panel{padding:22px 24px 26px;background:#fff}
  .panel h2{font-size:23px;margin:0 0 3px;letter-spacing:-.012em}
  .panel .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin:0 0 18px}
  .does{margin:0 0 22px;padding:0;list-style:none;font-size:14.5px}
  .does li{padding:5px 0 5px 16px;position:relative;color:var(--ink-2)}
  .does li:before{content:"";position:absolute;left:0;top:13px;width:6px;height:1px;background:var(--ink-3)}

  .sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);
    border-bottom:1px solid var(--ink);padding-bottom:6px;margin:0 0 12px}
  .sec+.sec{margin-top:26px}

  .tools{border:1px solid var(--rule);margin:0 0 26px;font-family:var(--mono);font-size:12.5px}
  .tools .t{border-bottom:1px solid var(--rule-2);padding:9px 12px}
  .tools .t:last-child{border-bottom:0}
  .tools .call{color:var(--ink)}
  .tools .call b{font-weight:600}
  .tools .ret{color:var(--ink-2);padding-left:16px;margin-top:4px;display:block}
  .tools .ret.no{color:var(--signal)}
  .tools .gate{background:var(--ground);color:var(--ink-2);font-size:11.5px}
  .tools .gate.pass{box-shadow:inset 3px 0 0 var(--ok)}
  .tools .gate.fail{box-shadow:inset 3px 0 0 var(--signal)}
  .none{border:1px solid var(--rule);padding:14px 12px;margin:0 0 26px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
  .ph{border:1px dashed var(--signal);padding:14px 12px;margin:0 0 26px;
    font-family:var(--mono);font-size:12.5px;color:var(--signal)}
  .ph b{letter-spacing:.06em}

  dl{margin:0 0 26px;display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--rule)}
  dt,dd{margin:0;padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:14px}
  dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--paper)}
  dd.m{font-family:var(--mono);font-size:12.5px;word-break:break-word}
  dl>:nth-last-child(-n+2){border-bottom:0}
  .flag{color:var(--signal);font-weight:600}
  .good{color:var(--ok);font-weight:600}
  .after{display:flex;gap:8px;flex-wrap:wrap}
  .after button{font-family:var(--mono);font-size:12px;padding:8px 12px}

  footer{border-top:1px solid var(--rule);margin-top:34px;padding:20px 0 54px;font-size:13px;color:var(--ink-2)}
  footer p{margin:0 0 7px;max-width:82ch}
  @media (max-width:820px){
    .stage{grid-template-columns:1fr}
    .rail{border-right:0;border-bottom:1px solid var(--rule);display:flex;overflow-x:auto}
    .rail button{border-bottom:0;border-right:1px solid var(--rule-2);white-space:nowrap;width:auto}
    dl{grid-template-columns:120px minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap mast">
  <h1>COMPASS<span>Type what you want to measure. Watch each stage retrieve, refuse, or block — with the tool calls it made.</span></h1>
  <nav class="links"><button class="g" id="dl-src">Download this page</button><a href="https://github.com/rmehta1987/COMPASS">Repo</a></nav>
</div></header>

<div class="bar"><div class="wrap">
  <input id="q" value="" aria-label="request" placeholder="a construct you want to measure">
  <button id="run">Run</button>
  <span class="ex" id="examples"></span>
</div></div>

<main class="wrap">
  <div class="stage">
    <nav class="rail" id="rail" aria-label="pipeline stage"></nav>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
  <footer>
    <p>Every figure on this page is loaded from a committed run artefact with a
    run id. Panels marked PLACEHOLDER have no committed artefact yet and show
    no numbers.</p>
  </footer>
</main>

<script>
/* Nothing on this page is typed in. Every stage description, run, record and
   figure is fetched from site/artefacts/*.json, each carrying its provenance.
   site-check.sh fails the build if a numeric literal appears here. */
const DATA={};
let sel="retriever", cur=null, typed=null;
const el=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const row=(k,v,m)=>`<dt>${k}</dt><dd class="${m?'m':''}">${v}</dd>`;
const f4=x=>x.toFixed(4);

async function load(){
  const idx=await (await fetch("artefacts/index.json")).json();
  DATA.index=idx;
  for(const f of idx.files){
    DATA[f.replace(/\.json$/,"")]=await (await fetch("artefacts/"+f)).json();
  }
}

function rail(){
  el("#rail").innerHTML=DATA.stages.stages.map((s,i)=>
    `<button data-s="${s.id}" aria-current="${s.id===sel}">
      <span class="n">${i+1}</span>${esc(s.name)}
      <span class="st ${esc(s.status)}">${esc(s.status_label)}</span></button>`).join("");
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel=b.dataset.s;draw();});
}

function examples(){
  el("#examples").innerHTML=DATA.runs.examples.map((e,i)=>
    `<button class="g" data-ex="${i}">${esc(e.label)}</button>`).join("");
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{
    cur=DATA.runs.examples[+b.dataset.ex]; typed=null; el("#q").value=cur.request.text; draw();});
}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean).join(" ");
function match(q){
  const n=norm(q);
  return DATA.runs.examples.find(e=>norm(e.request.text)===n||norm(e.rendered_query)===n)||null;
}

function placeholder(s){
  return `<p class="sec">output</p><div class="ph"><b>PLACEHOLDER</b> — no committed artefact yet. ${esc(s.placeholder)}`
    +(s.waits_for?` Waits for ${esc(s.waits_for)}.`:"")+`</div>`;
}
function noRun(){
  return `<p class="sec">output</p><div class="ph"><b>NO COMMITTED RUN</b> — this page has no encoder and never invents a score. The request is shown verbatim and nothing else: <em>${esc(typed)}</em>. The example buttons load the runs that were committed with this page.</div>`;
}

function toolLog(log){
  let h=`<div class="tools">`;
  for(const t of log){
    const args=Object.entries(t.args).map(([k,v])=>`${k}=${typeof v==="string"?JSON.stringify(v):(typeof v==="number"&&!Number.isInteger(v)?f4(v):v)}`).join(", ");
    let ret;
    if(t.returned===null) ret=`<span class="ret no">→ null — abstained</span>`;
    else ret=`<span class="ret">→ ${esc(Object.entries(t.returned).map(([k,v])=>`${k} ${typeof v==="number"&&!Number.isInteger(v)?f4(v):v}`).join(" · "))}</span>`;
    h+=`<div class="t"><span class="call"><b>${esc(t.tool)}</b>(${esc(args)})</span>${ret}</div>`;
  }
  return h+`</div>`;
}

function retrieverPanel(){
  const r=cur.record, p=DATA.runs.provenance, t=r.target||r.nearest_if_abstained;
  let h=`<p class="sec">tool calls · run ${esc(p.run_id)}</p>`+toolLog(cur.tool_log);
  h+=`<p class="sec">RetrievalRecord</p><dl>`
    +row("target",r.abstained?`<span class="flag">none — abstained</span> · nearest ${esc(t.pseudonym)}`:esc(t.pseudonym),true)
    +row("domain",esc(t.domain),true)
    +row("level",esc(t.level),true)
    +row("top cosine",f4(r.top_cos),true)
    +row("min_cos",`${f4(DATA.runs.threshold.min_cos)} · ${r.abstained?`<span class="flag">not cleared, short by ${f4(-r.gap_above_threshold)}</span>`:`cleared by ${f4(r.gap_above_threshold)}`}`,true)
    +row("abstained",r.abstained?`<span class="flag">true</span>`:"false",true)
    +row("margin to rank two",f4(r.margin_12),true)
    +row("roster fold",`${t.fold_size} roster row(s) folded into this target`,true)
    +row("option",t.option_position?`option ${t.option_position} of ${t.option_count}`:"stem-level target, no option",true)
    +row("query time",`${r.query_ms_median} ms median, isolated, this machine (${esc(p.machine.machine)}, ${p.machine.threads} threads)`,true)
    +row("targets scored",`${DATA.runs.corpus.n_targets.toLocaleString()} vectors · dictionary ${esc(p.bundle.dictionary_version_hash)}`,true)
    +`</dl>`;
  h+=`<p class="sec">next candidates</p><div class="tools">`+cur.candidates.map(c=>
    `<div class="t"><span class="call">${c.rank}. <b>${esc(c.pseudonym)}</b> · ${esc(c.domain)}</span><span class="ret">cos ${f4(c.cos)}${c.cos<DATA.runs.threshold.min_cos?" · below min_cos":""}</span></div>`).join("")+`</div>`;
  if(r.abstained){
    const a=DATA.absence;
    h+=`<p class="sec">absence check · dictionary ${esc(a.provenance.dictionary_version_hash)}</p><div class="tools">`
      +a.domains.map(d=>`<div class="t"><span class="call"><b>${esc(d.domain)}</b></span><span class="ret">dictionary entries matching ${d.dictionary_entries_matching} · targets matching ${d.targets_matching} · adjacent constructs present ${d.adjacent_constructs_present}</span></div>`).join("")
      +`<div class="t gate ${a.all_domains_absent?"pass":"fail"}">all ${a.domains.length} negative domains absent from ${a.n_dictionary_entries.toLocaleString()} entries and ${a.n_targets.toLocaleString()} targets: ${a.all_domains_absent}</div></div>`;
  }
  if(cur.note) h+=`<p class="sec">known limitation</p><div class="none" style="color:var(--signal)">${esc(cur.note)}</div>`;
  return h;
}

function intakePanel(){
  const q=cur.request, p=DATA.runs.provenance;
  let h=`<p class="sec">tool calls</p><div class="none">None. The template is deterministic string concatenation: same fields, same query, every run. No model call, no network.</div>`;
  h+=`<p class="sec">RetrievalRequest · run ${esc(p.run_id)}</p><dl>`
    +row("request",esc(q.text))
    +row("construct",esc(q.construct),true)
    +row("role",`${esc(q.role)} · never rendered`,true)
    +row("instances",q.instances.length?esc(q.instances.join(", ")):"<em>none</em>",true)
    +row("population",`<em>unset</em> · shipped contract leaves it empty`,true)
    +row("rendered query",esc(cur.rendered_query),true)
    +row("dropped as covered",cur.instances_dropped_as_covered.length?`${esc(cur.instances_dropped_as_covered.join(", "))} · every content word already in the construct`:"<em>nothing</em>",true)
    +row("origin",esc(cur.origin))
    +`</dl>`;
  h+=`<p class="sec">template</p><div class="none">[population] construct [timeframe][: instance, instance, …] — a slot renders only when its content words are not already present. Bundle template sha ${esc(p.bundle.template_py_sha256)}</div>`;
  return h;
}

function funnelPanel(){
  const f=DATA.funnel, st=f.stages, g=f.gate;
  let h=`<p class="sec">tool calls</p><div class="none">None. S1–S4 and the gate are deterministic: no model, no network.</div>`;
  h+=`<p class="sec">screen · captured ${esc(f.provenance.run_id)} · ${esc(f.provenance.commit)}</p><dl>`
    +row("S1 enumerate",`${st.S1_enumerated} candidate pairs over distinct constructs`,true)
    +row("S2 prune",`${st.S2_pruned} removed · construct identity, battery, free text, scale`,true)
    +row("S3 screen",`${st.S3_estimable} estimable · ${st.S3_unknown} unknown · ${st.S3_requires_derivation} need a derivation · ${st.S3_parked} parked`,true)
    +row("live",`${st.live} pairs reach the gate`,true)
    +row("gate",`passed <span class="flag">${g.passed}</span> · blocked <span class="flag">${g.blocked}</span> of ${g.live} · allow_unestimable ${g.allow_unestimable}`,true)
    +row("estimability",g.estimability_marks.map(m=>`<span class="flag">${esc(m)}</span>`).join(", "),true)
    +row("blocked on",esc(g.missing_exports.join(" · ")),true)
    +row("n source",esc(g.n_sources.join(", ")),true)
    +row("pairs emitted",`<span class="flag">${f.pairs_emitted}</span> without --allow-unestimable`,true)
    +row("dictionary",esc(f.provenance.dictionary_version_hash),true)
    +`</dl>`;
  h+=`<div class="none">The two exports are survey-metadata counts the study team holds. Until they arrive every pair carries the marker above and nothing reaches the Specifier by default.</div>`;
  return h;
}

function scorePanel(){
  const sc=DATA.score, e=sc.generation_env;
  const b=v=>v?`<span class="flag">true</span>`:`false <span class="good">required</span>`;
  let h=`<p class="sec">tool calls</p><div class="none">None in the generation clone. Scoring runs in a separate clone that holds the key, and has not run.</div>`;
  h+=`<p class="sec">GenerationEnv · stamped ${esc(sc.provenance.run_id)}</p><dl>`
    +row("key_present",b(e.key_present),true)
    +row("key_fetchable",b(e.key_fetchable),true)
    +row("branch",esc(e.branch),true)
    +row("tree_sha",esc(e.tree_sha),true)
    +row("tree_clean",String(e.tree_clean),true)
    +row("clean_for_scoring",e.clean_for_scoring?`<span class="good">true</span>`:`<span class="flag">false</span>`,true)
    +row("estimable denominator",`<span class="flag">${sc.estimable_denominator}</span>`,true)
    +row("status",`<span class="flag">${esc(sc.status)}</span> · scoring has run: ${sc.scoring_has_run}`,true)
    +`</dl>`;
  h+=`<p class="sec">why scoring has not run</p><ul class="does">${sc.why_not.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`;
  return h;
}

function draw(){
  const s=DATA.stages.stages.find(x=>x.id===sel);
  let h=`<h2>${esc(s.name)}</h2><p class="sub">${esc(s.sub)}</p>
         <ul class="does">${s.does.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`;
  if(typed!==null&&!cur) h+=noRun();
  else if(sel==="retriever"&&cur) h+=retrieverPanel();
  else if(sel==="intake"&&cur) h+=intakePanel();
  else if(sel==="funnel") h+=funnelPanel();
  else if(sel==="score") h+=scorePanel();
  else h+=placeholder(s);
  el("#panel").innerHTML=h;
}

el("#run").onclick=()=>{
  const q=el("#q").value.trim(); if(!q)return;
  cur=match(q); typed=cur?null:q; draw();
};
el("#dl-src").onclick=()=>{
  const b=new Blob([document.documentElement.outerHTML],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="compass-tool-page.html";a.click();URL.revokeObjectURL(a.href);};

load().then(()=>{const [first]=DATA.runs.examples; cur=first; el("#q").value=cur.request.text; examples(); rail(); draw();}).catch(e=>{
  el("#panel").innerHTML=`<h2>Artefacts did not load</h2><div class="ph"><b>NO DATA</b> — ${esc(e.message)}. Serve this directory over HTTP; a file:// open cannot fetch the artefacts.</div>`;
});
</script>
</body>
</html>
