<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMPASS — survey variable retrieval and study design</title>
<style>
  :root{
    --ground:#EDF0F2; --paper:#F7F9FA; --ink:#16232E; --ink-2:#4A5C69; --ink-3:#7A8B97;
    --rule:#C3CDD4; --rule-2:#DCE3E7; --signal:#A8621B; --ok:#2C5A4E;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--sans)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  header{border-bottom:2px solid var(--ink)}
  .mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;padding:30px 0 18px}
  h1{font-size:clamp(27px,3.8vw,40px);line-height:1.03;letter-spacing:-.025em;font-weight:640;margin:0}
  h1 span{display:block;font-family:var(--mono);font-size:.36em;font-weight:400;color:var(--ink-2);
    margin-top:11px;line-height:1.5;max-width:62ch;letter-spacing:.01em}
  .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
  .links a,.links button{color:var(--ink);text-decoration:none;border:1px solid var(--rule);background:var(--paper);padding:7px 12px;font:inherit;cursor:pointer}
  .links a:hover,.links a:focus-visible,.links button:hover,.links button:focus-visible{border-color:var(--ink)}

  .bar{border-bottom:1px solid var(--rule);background:var(--paper)}
  .bar .wrap{display:flex;gap:12px;align-items:center;padding:13px 24px;flex-wrap:wrap}
  .bar input{flex:1 1 340px;min-width:0;font:400 15px var(--sans);color:var(--ink);
    background:#fff;border:1px solid var(--rule);padding:10px 12px}
  .bar input:focus-visible{outline:2px solid var(--ink);outline-offset:-1px}
  button{font:500 14px var(--sans);color:var(--paper);background:var(--ink);
    border:1px solid var(--ink);padding:10px 18px;cursor:pointer}
  button.g{color:var(--ink);background:transparent}
  button:hover{opacity:.87} button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .bar .ex{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px}
  .bar .ex button{padding:6px 9px;font-family:var(--mono);font-size:11.5px}
  .bar .served{flex-basis:100%;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  button[disabled]{opacity:.45;cursor:not-allowed}

  .stage{display:grid;grid-template-columns:236px minmax(0,1fr);border:1px solid var(--rule);
    background:var(--paper);margin:28px 0 0}
  .rail{border-right:1px solid var(--rule)}
  .rail button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);
    border:0;border-bottom:1px solid var(--rule-2);padding:13px 16px;cursor:pointer;font:400 14px var(--sans)}
  .rail button:hover{background:#fff}
  .rail button[aria-current="true"]{background:#fff;box-shadow:inset 3px 0 0 var(--ink);font-weight:600}
  .rail .st{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;margin-top:3px}
  /* Neutral is the rail's normal state; `blocked` is the only colour a chip
     earns, and only when a live run failed. `shipped` and `pass` stay defined
     because `stages.json` is operator-edited data that may name them and
     `parse.py` fails on a status with no rule -- nothing emits them today. */
  .st.shipped{color:var(--ok)} .st.built{color:var(--ink-3)} .st.blocked{color:var(--signal)}
  .st.pass{color:var(--ok)}

  .panel{padding:22px 24px 26px;background:#fff}
  .panel h2{font-size:23px;margin:0 0 3px;letter-spacing:-.012em}
  .panel .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin:0 0 18px}
  .does{margin:0 0 22px;padding:0;list-style:none;font-size:14.5px}
  .does li{padding:5px 0 5px 16px;position:relative;color:var(--ink-2)}
  .does li:before{content:"";position:absolute;left:0;top:13px;width:6px;height:1px;background:var(--ink-3)}

  .sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);
    border-bottom:1px solid var(--ink);padding-bottom:6px;margin:0 0 12px}
  .sec+.sec{margin-top:26px}
  .sec.major{font-size:14px;letter-spacing:.01em;color:var(--ink);text-transform:none;
    border-top:1px solid var(--rule);border-bottom:2px solid var(--ink);
    padding-top:26px;padding-bottom:8px;margin-top:40px;font-family:inherit;font-weight:600}
  .sec.major em{display:block;font-style:normal;font-weight:400;font-size:12px;
    color:var(--ink-2);margin-top:5px;font-family:var(--mono)}
  .sec.lead{font-size:13.5px;letter-spacing:.02em;color:var(--ink);
    font-family:inherit;font-weight:600;padding-bottom:7px}

  .tools{border:1px solid var(--rule);margin:0 0 26px;font-family:var(--mono);font-size:12.5px}
  .tools .t{border-bottom:1px solid var(--rule-2);padding:9px 12px}
  .tools .t:last-child{border-bottom:0}
  .tools .call{color:var(--ink)}
  .tools .call b{font-weight:600}
  .tools .ret{color:var(--ink-2);padding-left:16px;margin-top:4px;display:block}
  .tools .ret.no{color:var(--signal)}
  .tools .gate{background:var(--ground);color:var(--ink-2);font-size:11.5px}
  .tools .gate.pass{box-shadow:inset 3px 0 0 var(--ok)}
  .tools .gate.fail{box-shadow:inset 3px 0 0 var(--signal)}
  /* These two hold sentences, not machine output. In 12.5px monospace grey
     they were the smallest text on the page and carried its longest
     paragraphs; the reader was asked to work hardest exactly where the
     argument is. Sans, larger, and the same measure as the body. */
  .none{border:1px solid var(--rule);padding:14px 13px;margin:0 0 22px;
    font-size:14.5px;line-height:1.6;color:var(--ink-2)}
  .none code,.none b{font-family:var(--mono);font-size:13px}
  .ph{border:1px dashed var(--signal);padding:14px 13px;margin:0 0 22px;
    font-size:14.5px;line-height:1.6;color:var(--signal)}
  /* A caveat the reader can open when they want it, instead of four grey slabs
     stacked between them and the table. Closed by default; the lead paragraph
     above it carries what a first read needs. */
  .fold{border:1px solid var(--rule);margin:0 0 22px;background:var(--paper)}
  .fold>summary{cursor:pointer;padding:11px 13px;font-size:14px;font-weight:600;
    color:var(--ink);list-style-position:inside}
  .fold>summary:hover{background:#fff}
  .fold[open]>summary{border-bottom:1px solid var(--rule)}
  .fold>.in{padding:4px 13px 6px}
  .notes{display:block;border:0;margin:0}
  .notes dt{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);
    background:none;border:0;padding:12px 0 2px}
  .notes dd{font-size:14.5px;line-height:1.6;color:var(--ink-2);border:0;padding:0 0 8px}
  .ph b{letter-spacing:.06em}
  /* The one box that is NOT an absence: solid ink, not the dashed orange that
     marks NOT YET RUN and NO RECORD. Orange used to mean both. */
  .key{border:1px solid var(--ink);border-left:5px solid var(--ink);padding:14px 12px;margin:0 0 26px;
    font-size:14px;color:var(--ink);background:var(--paper)}
  .key b{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}

  dl{margin:0 0 26px;display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--rule)}
  dt,dd{margin:0;padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:14px}
  dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--paper)}
  dd.m{font-family:var(--mono);font-size:13.5px;word-break:break-word}
  /* The exposure and the outcome are what the reader came for, and they were
     set at the same size as every other field on the panel. */
  .sec.role{font-size:13px;letter-spacing:.04em;color:var(--ink)}
  .anchors dt{font-size:13px}
  .anchors dd,.anchors dd.m{font-size:16px;line-height:1.45}
  dl>:nth-last-child(-n+2){border-bottom:0}
  .flag{color:var(--signal);font-weight:600}
  .good{color:var(--ok);font-weight:600}
  .pair{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .pair input{flex:1 1 210px;min-width:0;font:400 13px var(--mono);color:var(--ink);
    background:#fff;border:1px solid var(--rule);padding:9px 10px}
  .pair input:focus-visible{outline:2px solid var(--ink);outline-offset:-1px}
  .after{display:flex;gap:8px;flex-wrap:wrap}
  .after button{font-family:var(--mono);font-size:12px;padding:8px 12px}

  .measure{margin:34px 0 0}
  .measure h2{font-size:20px;margin:0 0 4px;letter-spacing:-.012em}
  .measure p.lead{margin:0 0 16px;font-size:14px;color:var(--ink-2);max-width:82ch}
  .tbl{overflow-x:auto;border:1px solid var(--rule);background:#fff;margin:0 0 18px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:8px 12px;border-bottom:1px solid var(--rule-2);text-align:right;font-family:var(--mono);font-size:13.5px;white-space:nowrap}
  th{font-weight:600;color:var(--ink-2);background:var(--paper);letter-spacing:.03em;font-size:11px}
  td:first-child,th:first-child{text-align:left;font-family:var(--sans);font-size:13.5px}
  tr:last-child td{border-bottom:0}
  td.hi{font-weight:600}
  /* A meaning column is a sentence, not a figure: the inherited nowrap would
     push it into a horizontal scroll and hide the thing it explains. */
  td.wr{white-space:normal;text-align:left;font-family:var(--sans);
    max-width:58ch;line-height:1.5}
  .prov{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:-8px 0 18px}
  footer{border-top:1px solid var(--rule);margin-top:34px;padding:20px 0 54px;font-size:13px;color:var(--ink-2)}
  footer p{margin:0 0 7px;max-width:82ch}
  /* CHARTS. Every constant here and NOTHING in the body: site/tools/
     no_fabrication.py strips the stylesheet before it scans, so geometry is
     legal here and a coordinate in the script is not. The script may only emit
     values it read from an artifact, as --x / --y / --v. */
  .fig{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 8px;margin:0 0 8px}
  .fig .yl{grid-row:1;font-family:var(--mono);font-size:10px;color:var(--ink-3);
    align-self:start;writing-mode:vertical-rl;transform:rotate(180deg);
    justify-self:end;height:100%;text-align:center}
  .fig .xl{grid-column:2;display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:5px}
  /* scatter: x normalised in the script, y IS the recall, so the axis is 0..1
     and a tenth of recall reads as a tenth of the height. A zoomed y would
     make three hundredths look like a result the fixture cannot support. */
  .scat{position:relative;height:210px;border-left:1px solid var(--rule);
    border-bottom:1px solid var(--rule);background-image:
      repeating-linear-gradient(to top,var(--rule-2) 0 1px,transparent 1px 25%);
    background-position:left bottom}
  .scat .pt{--x:.5;--y:.5;position:absolute;left:calc(var(--x) * 100%);
    bottom:calc(var(--y) * 100%);width:9px;height:9px;margin:-5px 0 0 -5px;
    border-radius:50%;background:var(--ink-2);box-shadow:0 0 0 2px var(--paper)}
  .scat .pt.ship{background:var(--signal);width:11px;height:11px;margin:-6px 0 0 -6px}
  .scat .pt>b{position:absolute;left:15px;top:-6px;font-weight:400;white-space:nowrap;
    font-family:var(--mono);font-size:11px;color:var(--ink)}
  .scat .pt.ship>b{font-weight:600}
  /* A flipped label extends LEFT, back towards the point on its left, and the
     two middle encoders sit a fifth of the plot apart. Dropping the flipped
     one clears the right-pointing label beside it without needing the script
     to know a pixel width. */
  .scat .pt.hi>b{left:auto;right:15px;top:5px}
  .scat .pt>.tip{display:none;position:absolute;left:15px;top:12px;z-index:3;
    background:var(--paper);border:1px solid var(--ink);padding:7px 9px;
    font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink);
    white-space:nowrap;box-shadow:2px 2px 0 var(--rule-2)}
  .scat .pt.hi>.tip{left:auto;right:15px}
  .scat .pt:hover>.tip,.scat .pt:focus-visible>.tip{display:block}
  .scat .pt:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
  /* ROC: square by construction. The chance diagonal is a gradient, so it
     needs no coordinate, and every point is placed straight off the artifact's
     percentages -- which is why the builder emits percentages rather than
     rates, the page having no literal hundred to multiply by. */
  .rocw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px;
    align-items:start;margin:0 0 8px}
  /* The plot is 250px, too narrow to carry a tick, an axis name and a tick on
     one line: `space-between` collided them into "0%accepted, of those it
     should decline100%". The two ticks keep the line, the name wraps below and
     centres under them. `costFig`'s plot is full-width, so it needs none of
     this and keeps the shared rule. */
  .rocw .xl{flex-wrap:wrap}
  .rocw .xl .ax{flex-basis:100%;text-align:center;padding-top:3px}
  /* `to bottom right`, NOT `to top right`. A gradient's constant-colour band is
     PERPENDICULAR to its axis, so `to bottom right` lays the 50% band across the
     bottom-left and top-right corners -- which is where chance lies, because
     `build_roc.py::curve` measures y from the TOP. `to top right` laid it across
     the top-left and bottom-right corners instead, joining the PERFECT corner to
     the WORST one, and both curves crossed it: the weak curve read as below
     chance over the low-FPR half, which is the half the threshold operates in.
     The legend calls this line chance in words, so a reader had no way to catch
     it. `parse.py::roc_reference_line_corners` derives the right pair of corners
     from the artifact's own endpoints and pins it. */
  .roc{position:relative;width:250px;height:250px;
    border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);
    background-image:linear-gradient(to bottom right,transparent calc(50% - 1px),
      var(--rule-2) calc(50% - 1px),var(--rule-2) calc(50% + 1px),
      transparent calc(50% + 1px))}
  .roc .p{--x:0;--y:0;position:absolute;left:calc(var(--x) * 1%);
    top:calc(var(--y) * 1%);width:3px;height:3px;margin:-2px 0 0 -2px;
    border-radius:50%;background:var(--ink-3)}
  .roc .p.a{background:var(--signal)}
  .roc .op{--x:0;--y:0;position:absolute;left:calc(var(--x) * 1%);
    top:calc(var(--y) * 1%);width:11px;height:11px;margin:-6px 0 0 -6px;
    border-radius:50%;background:var(--paper);border:2px solid var(--ink);z-index:2}
  .roc .op>b{position:absolute;left:16px;top:-4px;font-weight:400;white-space:nowrap;
    font-family:var(--mono);font-size:10.5px;color:var(--ink)}
  .key{font-family:var(--mono);font-size:11px;line-height:1.75;color:var(--ink-2)}
  .key b{color:var(--ink);font-weight:600}
  .key i{display:inline-block;width:9px;height:9px;border-radius:50%;
    margin-right:7px;font-style:normal;background:var(--rule)}
  .key i.a{background:var(--signal)} .key i.b{background:var(--ink-3)}
  /* bars: one row per topic, width straight off the value. A zero-width bar
     is left invisible on purpose -- the number beside it says 0.000, and
     padding it to a visible sliver would draw recall that was not measured. */
  .bars{margin:0 0 8px}
  .bars .b{display:grid;grid-template-columns:minmax(0,14ch) minmax(0,1fr) 9ch;
    gap:10px;align-items:center;padding:6px 0;font-family:var(--mono);font-size:11.5px}
  .bars .b+.b{border-top:1px solid var(--rule-2)}
  .bars .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars .track{position:relative;height:11px;background:var(--rule-2)}
  .bars .fill{--v:0;position:absolute;left:0;top:0;bottom:0;
    width:calc(var(--v) * 100%);background:var(--ink-2);border-radius:0 4px 4px 0}
  .bars .vl{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .bars .b:hover .fill{background:var(--signal)}

  @media (max-width:820px){
    .stage{grid-template-columns:1fr}
    .rail{border-right:0;border-bottom:1px solid var(--rule);display:flex;overflow-x:auto}
    .rail button{border-bottom:0;border-right:1px solid var(--rule-2);white-space:nowrap;width:auto}
    dl{grid-template-columns:120px minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap mast">
  <h1>COMPASS<span>Describe what you want to measure, and follow each stage as it retrieves, refuses, or blocks, with the dictionary lookups behind it.</span></h1>
  <nav class="links"><button class="g" id="dl-src">Download this page</button><a href="https://github.com/rmehta1987/COMPASS">Repo</a></nav>
</div></header>

<div class="bar"><div class="wrap">
  <input id="q" value="" aria-label="request" placeholder="a question, a construct, or two variable keys">
  <button id="ask" title="The full pipeline: retrieve candidate variables, then a language model assigns the exposure and the outcome. Requires the live server.">Ask the pipeline</button><button id="run" class="g" title="The deployed retriever alone: cosine similarity against the target vectors, with no language-model call and no cost. Also loads a committed example.">Search only</button>
  <span class="ex" id="examples"></span>
  <span class="served" id="served"></span>
</div></div>

<main class="wrap">
  <div class="stage">
    <nav class="rail" id="rail" aria-label="pipeline stage"></nav>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
  <footer id="foot"></footer>
</main>

<script>
/* Nothing on this page is typed in. Every stage description, run, record and
   figure is fetched from site/artifacts/*.json, each carrying its provenance.
   site-check.sh fails the build if a numeric literal appears here. */
const DATA={};
let sel="ask", cur=null, typed=null;
const el=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* Attribute context. `esc` leaves a double quote alone, which is harmless in
   element text and in a variable key, and breaks out of title=" the moment the
   value is question wording. */
const att=s=>esc(s).replace(/"/g,"&quot;");
const row=(k,v,m)=>`<dt>${k}</dt><dd class="${m?'m':''}">${v}</dd>`;
const f4=x=>x.toFixed(4);

async function load(){
  const emb=document.getElementById("embedded-artifacts");
  if(emb){Object.assign(DATA,JSON.parse(emb.textContent));return;}
  const idx=await (await fetch("artifacts/index.json")).json();
  DATA.index=idx;
  for(const f of idx.files){
    DATA[f.replace(/\.json$/,"")]=await (await fetch("artifacts/"+f)).json();
  }
}

/* What a stage is doing RIGHT NOW, or null to keep the committed chip.
   ONE VOCABULARY, and a chip says nothing else. It answers the only question a
   chip can answer from outside the panel: whose run is on this tab, is one
   coming, is it on the reader, or is there none.
     example           a worked example, chosen for you; you ran nothing
     past run          a recorded run of the project; no query changes it
     ran               a live run YOU started put this here
     running&hellip;   a run is in flight
     waiting for you   press something and there will be one
     nothing to show   none on this page, and the reader cannot make one
     failed            the run errored; the panel says how
   `ran` is the reader's own run and nothing else. A fresh load auto-selects the
   first committed example and pre-fills the search box, so five of the seven
   chips used to say `ran` before the reader had typed anything -- the rail was
   describing the artifacts, which the reader cannot tell apart from a claim
   about their own session. An example says `example` however it was reached:
   clicking one is the reader acting, but it is still not their query.
   The chips used to carry provenance -- which gate was off, what was withheld,
   which other tab held the result -- and read as a caption to a tab nobody had
   opened yet. Every one of those facts is stated in the body of the tab it
   belongs to, so the chip drops it rather than losing it.
   `stages.json` describes the SHIPPED state of the pipeline, not this session,
   so its chips describe the shipped pipeline. `rail` ran once at load and never
   again, so those stayed on screen through a completed run -- the page said no
   run had happened while showing its record -- and `aria-current` never moved
   either, so the rail did not even mark the stage being read.
   COLOUR MEANS ONE THING: a run failed. Everything settled is neutral. A green
   chip on the one scored run read as an achievement when what it denoted was
   zero matched against a ceiling of zero, so no chip claims a pass any more --
   the label states the tab's state and the panel states the result. `rail`
   interpolates a stage's own `status` straight into the class, so `stages.json`
   may only use a class the stylesheet defines; `parse.py` fails if it does not.
   An earlier note here claimed only three classes existed, which was true of
   this function's own returns and false of the committed data it falls back to. */
function liveStatus(id){
  /* Served, nothing run yet: it is on the reader, not withheld. The committed
     chip says "nothing to show", which is true of the static page and wrong
     here -- the button beside it works. */
  const served=!!window.COMPASS_ENDPOINT;
  /* Mirrors `stagePanel`'s own `noRun` test. Drift here and the chip describes
     a panel the reader is not looking at. */
  const noRun=typed!==null&&!cur;
  if(id==="ask"){
    if(posed) return {cls:"built",label:"nothing to show"};
    /* THE LATER PHASE WINS. One stop now covers proposing a pair and running
       the Specifier on it, and what the reader is waiting on is whichever is in
       flight -- a finished proposal saying "ran" over a run still going would
       describe the wrong half. `spec.error` is the only `blocked` on this chip:
       a refusal the environment upheld is a RESULT, and `spec` carries it as a
       record, not as an error. */
    if(spec){
      if(spec.running) return {cls:"built",label:"running&hellip;"};
      if(spec.error) return {cls:"blocked",label:"failed"};
      return {cls:"built",label:"ran"};
    }
    if(ask) return ask.running?{cls:"built",label:"running&hellip;"}:{cls:"built",label:"ran"};
    if(live) return {cls:"built",label:"ran"};
    if(noRun) return {cls:"built",label:"nothing to show"};
    return served?{cls:"built",label:"waiting for you"}:null;
  }
  if(id==="intake"){
    if(posed) return {cls:"built",label:"nothing to show"};
    if(live||(ask&&ask.rendered_query)) return {cls:"built",label:"ran"};
    if(noRun) return {cls:"built",label:"nothing to show"};
    return null;
  }
  if(id==="generate"&&gen&&!gen.running&&!gen.error) return {cls:"built",label:"ran"};
  return null;
}

function rail(){
  /* No sequence number: the rail is the pipeline's order, but a printed count
     read as a strict sequence and two of the seven stages were not in one. */
  el("#rail").innerHTML=DATA.stages.stages.map(s=>{
    const ls=liveStatus(s.id);
    return `<button data-s="${s.id}" aria-current="${s.id===sel}">
      ${esc(s.name)}
      <span class="st ${esc(ls?ls.cls:s.status)}">${ls?ls.label:esc(s.status_label)}</span></button>`;
  }).join("");
  /* Taking the ticket IS the reader saying where they want to be; see `steer`. */
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    navGen={}; sel=b.dataset.s; draw();});
}

function examples(){
  el("#examples").innerHTML=DATA.runs.examples.map((e,i)=>
    `<button class="g" data-ex="${i}">${esc(e.label)}</button>`).join("");
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{
    cur=DATA.runs.examples[+b.dataset.ex]; typed=null; live=null; posed=null; liveGen={}; navGen={};
    el("#q").value=cur.request.text; draw();});
}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean).join(" ");
function match(q){
  const n=norm(q);
  return DATA.runs.examples.find(e=>norm(e.request.text)===n||norm(e.rendered_query)===n)||null;
}

function placeholder(s){
  return `<p class="sec">output</p><div class="ph"><b>NO RECORD ON THIS PAGE</b> — ${esc(s.placeholder)}`
    +(s.waits_for?` Waits for ${esc(s.waits_for)}.`:"")+`</div>`;
}
/* Live retrieval, used only when this page is being SERVED BY serve/api.py.
   Same origin, so there is no host in the URL and no CORS: the offline gate
   forbids a host precisely because an external request is what this page must
   never make, and a same-origin call the reader triggers is not one. Opened
   from GitHub Pages or from file:// there is no /api, the fetch fails, and
   everything below falls back to the committed runs exactly as before. The
   endpoint answers with whatever IT was started with -- pseudonyms by default,
   wording under --show-instrument -- so this renders what it is given and
   claims nothing about which. */
let live=null, ask=null;

async function askResolver(stay){
  /* The button is disabled on the static page (see `draw`), so this branch is
     a keyboard or scripted reach; it still says something rather than nothing. */
  if(!window.COMPASS_ENDPOINT){ el("#served").textContent=servedNote(); return; }
  const q=el("#q").value.trim(); if(!q) return;
  const gen=(liveGen={}), nav=(navGen={});
  /* `stay` keeps the reader where they are. The Specifier tab asks for two
     variable KEYS, which a reader who has not been given the codebook does not
     have -- so it offers a question instead and runs this, filling the key
     fields from what comes back. Same request, same ticket, same poll, same
     `adoptProposals`: a second copy of this loop would drift from it. */
  live=null; posed=null; cur=null; typed=null; ask={running:true};
  if(!stay) sel="ask";
  draw();
  try{
    const r=await fetch("/api/pair",{method:"POST",
      headers:{"Content-Type":"application/json"},
      /* SPLIT ON. A shared pool carries every construct a request names in only
         a minority of composed requests -- the share, and the oracle ceiling
         beside it, are in `out/pool_coverage.json` and `TASKS.md` §C29; no
         figure is restated here, because this page states none. That shortfall
         is why an exposure list came back full of outcome-side items: the role
         never reaches the encoder, so both roles were offered the identical
         pool. With `split` a model names the exposure and outcome phrases
         first, each is retrieved alone at an equal share of the same budget,
         and `prompt_contract.py::parse_split` refuses any phrase that is not
         the request's own words.

         `_split_pools` FALLS BACK to the shared pool whenever the split cannot
         be used and says why, so the failure it cannot catch is a split that is
         usable but WRONG. That one has no fallback, so `poolNote` prints the
         phrases it split on -- an operator can see a wrong split rather than
         reading a confident pool built from the wrong words.

         C29's ACCEPT is still owed: a split fixture authored without sight of
         the gold wording, reported against that file's shared row. The
         published ceiling was measured on the fixture's OWN phrases, so it
         bounds a perfect decomposition, not this splitter. */
      body:JSON.stringify({request:q,split:true})});
    const j=await r.json().catch(()=>null);
    if(!j||typeof j!=="object"){ ask={error:`the server answered ${r.status}`}; return; }
    if(!j.ticket){ ask=j; return; }
    for(;;){
      await new Promise(done=>setTimeout(done,j.poll_after_ms));
      if(gen!==liveGen) return;
      const s2=await fetch("/api/specify/status",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ticket:j.ticket})});
      const u=await s2.json().catch(()=>null);
      if(!u||typeof u!=="object"){ ask={error:`the server answered ${s2.status}`}; return; }
      if(u.status==="running"){ ask={running:true,elapsed_s:u.elapsed_s}; draw(); continue; }
      ask=u; adoptProposals(u);
      /* Keys in, design out. Nothing was inferred, so there is nothing to
         confirm -- see adoptProposals for where that line is drawn. */
      if(allPinned(u)){ draw(); runSpecifier(nav); return; }
      return;
    }
  }catch(err){ ask={error:"the server did not answer"}; }
  finally{ draw(); }
}

function allPinned(j){
  /* True only when BOTH anchors came from keys in the request. A `resolved`
     verdict is the model's judgement and still gets a look before it runs. */
  if(!j||!j.roles) return false;
  return ["exposure","outcome"].every(r=>
    j.roles[r]&&j.roles[r].verdict==="pinned"&&j.roles[r].pinned_key);
}

function adoptProposals(j){
  /* Carry over only what the model COMMITTED to. `resolved` and `pinned` are
     answers; `ambiguous`, `absent`, `derive` and `family` are it declining, and
     filling those would pick one to be helpful -- the exact move the retrieval
     guidance forbids. The reader still presses Run, which is the confirmation. */
  if(!j||!j.roles) return;
  for(const role of ["exposure","outcome"]){
    const v=j.roles[role]; if(!v) continue;
    if(v.verdict==="pinned"&&v.pinned_key){ anchors[role]=v.pinned_key; continue; }
    if(v.verdict!=="resolved") continue;
    const pick=(v.candidates||[]).find(c=>c.proposed&&c.key);
    if(pick) anchors[role]=pick.key;
  }
}

function roleBlock(role,v){
  let h=`<p class="sec role">${role} &middot; <b>${esc(v.verdict)}</b></p>`;
  if(v.verdict==="pinned") return h+`<div class="tools"><div class="t gate pass">`
    +`<span class="call"><b>${esc(v.pinned_key||"")}</b> ${esc(v.pinned_wording||"")}</span>`
    +`<span class="ret">named in the request &mdash; not inferred</span></div></div>`;
  if(v.reason) h+=`<div class="none">${esc(v.reason)}</div>`;
  if(v.missing_dimension) h+=`<div class="none" style="color:var(--signal)">`
    +`what would settle it: ${esc(v.missing_dimension)}</div>`;
  /* A `derive` verdict's RECIPE was dropped. `roleBlock` showed the verdict,
     the reason, the missing dimension and the candidates -- and not the one
     field that says what to compute, which on a `derive` is the whole answer.
     MEASURED on "have you felt discriminated against and resulting in
     depression, anxiety, or bipolar": the outcome came back `derive` over
     three indices with a composite recipe, and the reader saw none of it. */
  if(v.recipe) h+=`<div class="none" style="color:var(--signal)">`
    +`how to compute it: ${esc(v.recipe)}</div>`;
  /* The retriever would have ABSTAINED on this pool and this route did not ask
     it to. Said where the candidates are, because a list that looks confident
     is what a sub-threshold pool looks like. */
  if(v.below_threshold) h+=`<div class="none" style="color:var(--signal)">`
    +`The best candidate here scores below the deployed retriever's own`
    +` abstention threshold, so <b>Search only</b> would have declined to answer`
    +` instead of offering these. Treat any pick from this list as unsupported`
    +` until you check the instrument yourself.</div>`;
  h+=`<div class="tools">`+v.candidates.map(c=>
      `<div class="t${c.proposed?" gate pass":""}"><span class="call">`
      +`${c.proposed?"&#10003; ":""}${c.index}. <b>${esc(c.key||"")}</b> ${esc(c.wording)}</span>`
      +`<span class="ret">cos ${f4(c.cos)}</span>`
      +(c.key?`<button class="g pick" data-anchor="${role}" data-key="${esc(c.key)}">use</button>`:"")
      +`</div>`).join("")+`</div>`;
  return h;
}

/* WHERE THE CANDIDATES CAME FROM, stated once above the two role blocks.
   The `retriever` rail stop became `ask` because a standalone cosine panel is
   not something a reader can act on -- so the encoder has to account for
   itself HERE, where the answer it produced is being read. The stop it used to
   have is still reachable as the `Search only` button, which is also the only
   thing the static page can run.

   ONLY WHAT THE ROUTE RETURNED. `/api/pair` offers a pool; it does not run the
   abstention check, so there is no threshold and no `abstained` verdict in this
   payload and none is printed. Those belong to `/api/retrieve` and are shown on
   a selected example, which is where they are actually measured. Printing a
   threshold here would be a figure this run did not produce. */
function poolNote(j){
  const roles=["exposure","outcome"].map(r=>j.roles&&j.roles[r]).filter(Boolean);
  const cands=roles.map(v=>v.candidates||[]).filter(c=>c.length);
  if(!cands.length) return "";
  /* The shared pool is one list offered to both roles, so the larger is the
     pool; under `split` each role has its own and they are reported separately. */
  const split=j.split&&j.split.status&&j.split.status!=="off";
  const n=Math.max(...cands.map(c=>c.length));
  const all=[].concat(...cands).map(c=>c.cos).filter(x=>typeof x==="number");
  const hi=Math.max(...all), lo=Math.min(...all);
  return `<p class="sec">how these were found</p><div class="none">`
    +`${n} candidate(s) from the encoder&mdash;fine-tuned bge-small,`
    +` cosine against precomputed target vectors, with no language-model call in`
    +` that step&mdash;scoring from cos ${f4(hi)} down to ${f4(lo)}.`
    +(split?` The server retrieved each role from its OWN phrases, not from one`
            +` shared pool.`
           :` One pool serves both roles: the encoder turns your whole question`
            +` into a single vector, so it cannot distinguish an exposure from an`
            +` outcome. The language model above assigned the roles.`)
    +`</div>`
    /* The phrases, because a split that is usable but WRONG has no fallback:
       `_split_pools` catches a refused or unsplittable reply and returns the
       shared pool saying why, but nothing catches a phrase put under the wrong
       role. Printing them is what makes that visible instead of silent. */
    +(split&&(j.split.exposures||j.split.outcomes)
      ?`<div class="tools">`
        +`<div class="t"><span class="call">split on &middot; exposure</span>`
        +`<span class="ret">${(j.split.exposures||[]).map(esc).join(" &middot; ")||"none"}</span></div>`
        +`<div class="t"><span class="call">split on &middot; outcome</span>`
        +`<span class="ret">${(j.split.outcomes||[]).map(esc).join(" &middot; ")||"none"}</span></div>`
        +`</div>`
      :"")
    +(j.split&&j.split.status==="fallback"
      ?`<div class="none" style="color:var(--signal)">The split was unusable,`
       +` so both roles drew on one shared pool:`
       +` ${esc(j.split.why||"no reason given")}</div>`
      :"");
}

function resolverPanel(){
  const j=ask;
  if(j.running) return `<p class="sec">reading the request</p><div class="ph"><b>IN PROGRESS</b>`
    +`${typeof j.elapsed_s==="number"?` &mdash; ${j.elapsed_s}s`:""} &mdash; the language model reads`
    +` your request and the candidate list and selects by index. The server resolves`
    +` the index, so the model never writes a key.</div>`;
  if(j.error) return `<p class="sec">output</p><div class="ph"><b>NO ANSWER</b> &mdash; ${esc(j.error)}</div>`;
  let h=`<p class="sec">request read by ${esc(j.model_id)} &middot; not a committed run</p><dl>`
    +row("request",esc(j.request))
    +row("proposed by",esc(j.anchors_proposed_by),true)
    +`</dl>`
    +poolNote(j);
  for(const role of ["exposure","outcome"]) if(j.roles&&j.roles[role]) h+=roleBlock(role,j.roles[role]);
  const declined=["exposure","outcome"].filter(r=>j.roles&&j.roles[r]
    &&j.roles[r].verdict!=="resolved"&&j.roles[r].verdict!=="pinned");
  h+=`<p class="sec">chosen pair</p>`
    +(allPinned(j)?`<div class="none" style="color:var(--signal)">`
      +`The request named both anchors, so nothing was inferred and the`
      +` Specifier started automatically.</div>`:"")
    +(declined.length?`<div class="none" style="color:var(--signal)">`
      +`The language model declined to choose the ${esc(declined.join(" and "))}, so no`
      +` choice is filled in. Pick one yourself, or ask again with a more specific request.</div>`
      :`<div class="none">Filled from the language model's committed choices. Change either`
      +` before you run.</div>`)
    +`<dl class="anchors">`
    +row("exposure",anchors.exposure?esc(anchors.exposure):"<em>none picked</em>",true)
    +row("outcome",anchors.outcome?esc(anchors.outcome):"<em>none picked</em>",true)
    +`</dl>`
    +(anchors.exposure&&anchors.outcome
      ?`<div class="after"><button class="g" id="go-spec">Run the Specifier on this pair</button></div>`
      :"");
  h+=`<div class="none" style="color:var(--signal)">${esc(j.not_a_selection)}</div>`;
  return h;
}

/* The pair the reader assembled, and the last Specifier answer. Both live
   alongside `live` rather than inside it: a run outlives the retrieval that
   suggested its anchors. */
const anchors={exposure:null,outcome:null};
let spec=null, specBusy=false;

async function runSpecifier(nav){
  if(!window.COMPASS_ENDPOINT||specBusy) return;
  if(!anchors.exposure||!anchors.outcome) return;
  /* Clicked directly this is the reader's own intent, so it takes a fresh
     ticket; chained from the resolver it inherits that request's. */
  if(nav===undefined) nav=(navGen={});
  specBusy=true; spec={running:true}; steer(nav,"ask"); draw();
  try{
    const r=await fetch("/api/specify",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({exposure:anchors.exposure,outcome:anchors.outcome})});
    const j=await r.json().catch(()=>null);
    /* A refusal, a busy answer while another run holds the lock, and a
       bad-request for an unresolvable key are all ANSWERS, not failures:
       show what came back rather than collapsing them into "no endpoint". */
    if(!j||typeof j!=="object"){ spec={error:`the server answered ${r.status}`}; return; }
    if(!j.ticket){ spec=j; return; }
    /* A RUN OUTLIVES ANY ONE REQUEST. Held open, the POST hit Cloudflare's
       proxy ceiling and died with a gateway timeout while the run itself
       carried on happily to completion. So the POST hands back a ticket and
       we ask again on the interval the server names: the page states no
       number of its own. */
    spec={running:true,ticket:j.ticket}; draw();
    for(;;){
      await new Promise(done=>setTimeout(done,j.poll_after_ms));
      const q=await fetch("/api/specify/status",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ticket:j.ticket})});
      const u=await q.json().catch(()=>null);
      if(!u||typeof u!=="object"){ spec={error:`the server answered ${q.status}`}; return; }
      if(u.status==="running"){ spec={running:true,ticket:j.ticket,elapsed_s:u.elapsed_s}; draw(); continue; }
      spec=u; return;
    }
  }catch(err){
    spec={error:"the server did not answer"};
  }finally{
    specBusy=false;
    /* Land the reader on the object, not on the machinery that made it. */
    /* Was `record`, then `specifier`; both are gone. A finished run leaves the
       reader on the stop that produced it, where the record now is. */
    if(spec&&(spec.selected||spec.refusal)) steer(nav,"ask");
    draw();
  }
}

function anchorLine(a){
  /* Exposure and outcome are a union: a variable reference, a derivation, or a
     roster family. Show whichever arrived rather than assuming a key. */
  if(!a) return "<em>none</em>";
  const wording=a.quoted_wording?` &mdash; ${esc(a.quoted_wording)}`:"";
  return `<b>${esc(a.key||a.derivation_id||a.group_key||a.kind||"")}</b>${wording}`;
}

function covBlock(title,list,note){
  if(!list||!list.length) return `<p class="sec">${title}</p><div class="none">${note}</div>`;
  return `<p class="sec">${title} &middot; ${list.length}</p><div class="tools">`
    +list.map(c=>`<div class="t"><span class="call"><b>${esc(c.variable&&(c.variable.key||c.variable.derivation_id)||"")}</b>`
      +` &middot; ${esc(c.role||"")}${c.contestable?" &middot; contestable":""}</span>`
      +`<span class="ret">${esc(c.mechanism||c.justification||"")}</span></div>`).join("")
    +`</div>`;
}

function readableProtocol(r){
  const m=r.model_spec||{}, e=r.estimability||{}, a=r.access||{}, ft=r.falsifier_threshold;
  let h=`<dl>`
    +row("question",esc(r.question))
    +row("expected direction",(function(d){
        /* A structured type, not a string: direction plus an optional magnitude
           and where that magnitude came from. Rendered as `[object Object]`
           until this was checked against a real record. */
        if(!d) return "<em>none</em>";
        const mag=d.magnitude===null||d.magnitude===undefined?"":
          ` &middot; ${esc(String(d.magnitude))}`
          +(d.magnitude_source?` (${esc(d.magnitude_source)})`:"");
        return `${esc(d.direction||"")}${mag}`;
      })(r.expected_direction),true)
    +row("exposure",anchorLine(r.exposure),true)
    +row("outcome",anchorLine(r.outcome),true)
    +row("analysis model",`${esc(m.form||"")} &middot; per ${esc(m.unit_of_analysis||"")}`
        +(m.clustering?` &middot; clustered on ${esc(m.clustering)}`:""),true)
    +row("falsifier",esc(r.falsifier))
    +(ft?row("threshold",`${esc(String(ft.comparator||""))} ${esc(String(ft.value))} `
        +`${esc(ft.unit||"")}`,true):"")
    +`</dl>`;
  h+=covBlock("adjusted",r.adjusted_covariates,"none");
  h+=covBlock("excluded on purpose",r.excluded_variables,
              "none &mdash; the schema rejects an empty exclusion list, so a single entry is a required minimum, not a finding");
  h+=covBlock("undetermined",r.undetermined_covariates,"none");
  if(r.sought_covariates&&r.sought_covariates.length)
    h+=`<p class="sec">looked for and not found &middot; ${r.sought_covariates.length}</p>`
      +`<div class="tools">`+r.sought_covariates.map(u=>
        `<div class="t"><span class="call"><b>${esc(u.construct_sought||"")}</b></span>`
        +`<span class="ret">${esc(u.exposes_the_estimate_to||u.why_rejected||"")}</span></div>`
        +(u.search_phrases&&u.search_phrases.length
          ?`<div class="t"><span class="call">tried: ${u.search_phrases.map(esc).join(" &middot; ")}</span></div>`:"")
      ).join("")+`</div>`;
  h+=`<p class="sec">estimability</p><dl>`
    +row("analytic n",e.analytic_n===null||e.analytic_n===undefined
        ?`<span class="flag">unknown</span> &middot; ${esc(e.n_source||"")}`
        :`${esc(String(e.analytic_n))} &middot; ${esc(e.n_source||"")}`,true)
    +row("modules required",esc((e.modules_required||[]).join(", ")),true)
    +(e.exposure_contrast?row("contrast",esc(e.exposure_contrast)):"")
    +row("access",esc(a.decision||""),true)
    +`</dl>`;
  h+=`<p class="sec">status</p><div class="tools">`
    +`<div class="t gate ${(r.blocked_on||[]).length?"fail":"pass"}"><span class="call">`
    +`<b>${esc(r.status||"")}</b></span><span class="ret">`
    +((r.blocked_on||[]).length?`blocked on ${esc(r.blocked_on.join(", "))}`
      :"no blockers")+`</span></div></div>`;
  return h;
}

function readableRefusal(r){
  let h=`<dl>`
    +row("pair",esc(r.pair_id),true)
    +row("reason",`<b>${esc(r.reason||"")}</b>`,true)
    +row("statement",esc(r.statement))
    +row("what would unblock it",esc(r.what_would_unblock))
    +`</dl>`;
  if(r.evidence&&r.evidence.length) h+=`<p class="sec">evidence &middot; the dictionary lookups the server made</p>`
    +`<div class="tools">`+r.evidence.map(v=>
      `<div class="t"><span class="call"><b>${esc(v.tool||"")}</b>(${esc(v.argument||"")})</span>`
      +`<span class="ret">&rarr; ${esc(v.outcome||"")}</span></div>`).join("")+`</div>`;
  if((r.blocked_on||[]).length) h+=`<div class="none">blocked on ${esc(r.blocked_on.join(", "))}</div>`;
  return h;
}

let gen=null, genBusy=false;

async function enumerate(){
  if(!window.COMPASS_ENDPOINT||genBusy) return;
  genBusy=true; gen={running:true}; sel="generate"; draw();
  try{
    const r=await fetch("/api/enumerate",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({})});
    const j=await r.json().catch(()=>null);
    gen=(j&&typeof j==="object")?j:{error:`the server answered ${r.status}`};
  }catch(err){ gen={error:"the server did not answer"}; }
  finally{ genBusy=false; draw(); }
}

function generatePanel(){
  const committed=DATA.funnel.gate;
  let h=`<p class="sec">the committed gate</p>`
    +`<div class="tools"><div class="t gate ${committed.passed?"pass":"fail"}">`
    +`<span class="call">live ${committed.live} &middot; passed ${committed.passed}`
    +` &middot; blocked ${committed.blocked}</span>`
    +`<span class="ret">${committed.blocked_on.map(esc).join(" &middot; ")}</span></div></div>`;
  /* Same page, two trees. This gate output is the worked frame in the
     generation clone; the scored run on Metrics used a different frame, a
     different tree, and the gate switched off. Left unsaid, the two read as
     one run that both did and did not happen. */
  const mp=DATA.metrics.provenance;
  h+=`<div class="none">This is the gate as committed. `
    +`The run scored on the <b>Metrics</b> tab `
    +`came from a different frame with this gate `
    +`switched off, which is currently the only way a pair reaches the Specifier: all `
    +`${DATA.metrics.observed.scored} of its records carry the mark above.</div>`;
  if(!window.COMPASS_ENDPOINT) return h+`<div class="none">Served statically, so you`
    +` cannot run the funnel from here. The figures above are the committed run.</div>`;
  if(!gen) return h+`<div class="after"><button class="g" id="go-gen">Run the funnel now</button></div>`;
  if(gen.running) return h+`<div class="ph"><b>ENUMERATING</b> &mdash; S1 and S2 are`
    +` deterministic and make no language-model call.</div>`;
  if(gen.error) return h+`<div class="ph"><b>NO OUTPUT</b> &mdash; ${esc(gen.error)}</div>`;
  const c=gen.counts;
  h+=`<p class="sec">this run of the funnel</p><dl>`
    +row("sets",`${gen.sets.exposures} exposure(s) &times; ${gen.sets.outcomes} outcome(s)`
        +` &middot; module ${esc(gen.sets.exposure_module)} ${esc(gen.sets.exposure_prefix)}`
        +` &rarr; module ${esc(gen.sets.outcome_module)} ${esc(gen.sets.outcome_prefix)}`,true)
    +row("enumerated (S1)",String(c.enumerated),true)
    +row("pruned (S2)",String(c.pruned_S2),true)
    +row("live",String(c.live),true)
    +row("estimable (S3)",`<span class="flag">${c.estimable}</span> &middot; unknown ${c.unknown}`,true)
    +row("requires derivation",String(c.requires_derivation),true)
    +`</dl>`;
  h+=`<div class="none" style="color:var(--signal)">${esc(gen.note)}</div>`;
  launchable={};
  h+=`<p class="sec">pairs &middot; showing ${gen.shown} of ${c.enumerated}</p><div class="tools">`
    +gen.pairs.map((pr,pi)=>{
      const tok=`generate:${pi}`;
      /* A PRUNED PAIR IS NOT LAUNCHABLE. Every row used to get a button: the
         payload carried no state, and the prunes sat past the end of the
         head slice, where it never reached them. Spreading the slice across exposures
         brings them onto the first page, so the state has to be read here.
         A payload with no `state` at all is treated as live, which is what an
         older endpoint sends -- the field's presence is pinned server-side. */
      const pruned=!!pr.state&&pr.state!=="live";
      if(!pruned&&pr.exposure&&pr.outcome) launchable[tok]={source:"generate",
        source_label:"the funnel's enumerated pairs on the Generate tab",
        id:pr.pair_id, exposure:pr.exposure, outcome:pr.outcome,
        exposure_text:pr.exposure_stem||"", outcome_text:pr.outcome_stem||"",
        question:""};
      return `<div class="t"><span class="call"><b>${esc(pr.pair_id)}</b></span>`
      +(pruned
        ?`<span class="ret">pruned at ${esc(pr.stage||"S2")} &middot; ${esc(pr.reason||"")}</span>`
        :pr.exposure&&pr.outcome
        ?/* `att`, not `esc`: these are attribute values from the endpoint, and `esc`
             leaves a double quote alone -- one in a key closes the attribute early
             and the rest becomes markup inside a button. `att` was already used
             for the token beside them. Proved red by the planted quote in
             `render_endpoint.js`. */
          `<button class="g pick" data-genex="${att(pr.exposure)}" data-genout="${att(pr.outcome)}" data-launch="${att(tok)}">specify this pair</button>`
        :`<span class="ret">keys withheld</span>`)+`</div>`
      +`<div class="t"><span class="call">${esc(pr.exposure_stem||"")} &rarr; ${esc(pr.outcome_stem||"")}</span></div>`;
    }).join("")+`</div>`;
  return h;
}

/* What the TYPE carries and what it does not. This was the tail of

function recordCarries(){

    +`<div class="t gate pass"><span class="call">estimability stamped on the record</span>`
    +`<span class="ret">in the record</span></div>`
    +`<div class="t gate pass"><span class="call">analysis model, unit of analysis, clustering</span>`
    +`<span class="ret">in the record</span></div>`
    +`<div class="t gate fail"><span class="call">a study-design field: cross-sectional, cohort, case-control</span>`
    +`<span class="ret">no such field</span></div>`

    +`<span class="ret">no such field; a mediator is rejected by the role it was given in a list</span></div></div>`
    +`<div class="none">The object above is either a <code>ProtocolSpecification</code> or a `
    +`<code>NotSpecifiable</code> refusal; the Specifier builds nothing else.</div>`;

function specifierPanel(){
  const j=spec;
  if(j.running) return `<p class="sec">running</p><div class="ph"><b>IN PROGRESS</b>`
    +`${typeof j.elapsed_s==="number"?` &mdash; ${j.elapsed_s}s elapsed`:""}`
    +` &mdash; a real run: the language model reasons, consults the dictionary as`
    +` it goes, and writes the record, and then the gate checks it. Expect minutes,`
    +` not seconds. The run continues on the server whatever happens to this page.`
    +` One run at a time: the server refuses a second run instead of queuing it.</div>`;
  if(j.error) return `<p class="sec">output</p><div class="ph"><b>NO RECORD</b> &mdash; ${esc(j.error)}</div>`;
  const id=j.identity||{};
  let h=`<p class="sec">run &middot; not a measurement</p><dl>`
    +row("pair",esc(id.protocol_id),true)
    +row("language model",`${esc(id.model_id)}${id.is_pipeline_model?"":` <span class="flag">not the pipeline proxy</span>`}`,true)
    +row("selection",`${esc(id.selection_mode)} &middot; screened_from ${id.screened_from}`,true)
    +(id.key_case_corrected?row("key case corrected",esc(JSON.stringify(id.key_case_corrected)),true):"")
    +row("records produced",esc(j.yield),true)
    +`</dl>`;
  if(Array.isArray(j.samples)&&j.samples.length){
    h+=`<p class="sec">attempts</p><div class="tools">`+j.samples.map(a=>
      `<div class="t"><span class="call"><b>${esc(a.gate)}</b></span>`
      +`<span class="ret">${a.tool_calls} lookup(s), ${a.transductions} structuring pass(es)</span></div>`
      /* ESCAPE EACH ITEM, THEN JOIN. Joining first and escaping the result put
         the separator through `esc`, which turns `&` into `&amp;` -- so the
         reader saw the literal text `&middot;` between every tool name. Every
         other list on this page maps `esc` over its items for this reason. */
      +(Array.isArray(a.distinct_tools)?`<div class="t"><span class="call">${a.distinct_tools.map(esc).join(" &middot; ")}</span></div>`:"")
    ).join("")+`</div>`;
  }
  const rec=j.selected||j.refusal;
  if(rec){
    /* THE RECORD IS READ HERE. It had a rail stop of its own, `record`, which
       put the run and the thing the run produced two clicks apart under a name
       that said nothing about what was in it. The Specifier is the stage that
       builds this, so this is where it is read. */
    h+=`<p class="sec">what it produced &middot; `
      +`${j.selected?"a protocol":"a refusal the environment upheld"}</p>`
      +(j.selected?readableProtocol(rec):readableRefusal(rec))
      +`<details><summary>the record as JSON &middot; provenance</summary>`
      +`<pre class="rec">${esc(JSON.stringify(rec,null,2))}</pre></details>`
      +recordCarries();
  }else{
    h+=`<p class="sec">output</p><div class="ph"><b>NO RECORD</b> &mdash; ${esc(j.reason||"the run produced neither a protocol nor a refusal")}</div>`;
    /* A rejected design is still a design. The sample kept it, so show it: a
       run can spend ten minutes and dozens of tool calls building one, and it
       is worth reading and scoring even when the gate refused to authorise it.
       The gate's verdict stands; this only stops it being invisible. */
    for(const a of (j.samples||[])){
      if(a.rejected_record) h+=`<p class="sec">the design the gate rejected</p>`
        +(typeof a.rejected_record==="object"&&a.rejected_record.question
          ?readableProtocol(a.rejected_record):"")
        +`<details><summary>as JSON &middot; provenance</summary><pre class="rec">`
        +`${esc(typeof a.rejected_record==="string"?a.rejected_record:JSON.stringify(a.rejected_record,null,2))}`
        +`</pre></details>`;
      if(a.analysis) h+=`<p class="sec">what the language model established</p>`
        +`<details><summary>the reasoning, in full</summary>`
        +`<pre class="rec">${esc(a.analysis)}</pre></details>`;
    }
  }
  if(j.not_a_measurement) h+=`<div class="none" style="color:var(--signal)">${esc(j.not_a_measurement)}</div>`;
  return h;
}

/* Every request that can change the panel takes a ticket. An await
   suspends, and the reader keeps clicking: without this, a slow live
   reply lands after they picked an example and paints over it. */
let liveGen=null;

/* `liveGen` answers "is this reply still about the query on screen". It does not
   answer "may this reply move the reader", and those come apart the moment a run
   is slow. A Specifier run can outlast the reader's patience by minutes; they
   spend that time reading other stages, and the `finally` below then drags them
   to the record. Dropping the
   reply instead would be worse -- the query has not changed and the answer they
   asked for would be thrown away. So a second ticket: a rail or example click
   takes it, and every stage change that happens AFTER an await must still hold
   the one it was issued. Panels still fill; only the steering is forfeited. */
let navGen=null;
function steer(nav,stage){ if(nav===navGen) sel=stage; }

/* A pair launched from Metrics or Generate is POSED, not retrieved: no query was
   rendered and no vectors were scored. Retriever and Intake used to keep showing
   whatever was there before -- a committed example, or the previous request's
   hits -- beside a record produced from a different pair entirely, so the page
   answered "what was actually run?" with another run's numbers. `posed` is what
   those two stages read instead, and the launch clears `live` and `ask` so there
   is nothing stale left to fall through to. It never invents a retrieval: there
   was none, and saying so is the whole point. */
let posed=null;

/* Rows a run can be launched from, rebuilt by whichever panel drew them and
   addressed by token, not by bare index: a button left over from another panel
   resolves to nothing rather than to the wrong row. The button still carries
   the two keys, which is what the Specifier needs; this carries the wording and
   the provenance, which is what the reader needs. */
let launchable={};

async function liveRetrieve(q){
  /* INERT unless the endpoint said so. On GitHub Pages a root-relative
     "/api/retrieve" does NOT fail: it resolves against the Pages origin, the
     POST leaves the browser carrying what the reader typed, and a not-found
     answer comes back. The offline gate certifies "zero external requests" and cannot see
     a hostless URL, so the page must be unable to make that request at all --
     not merely handle its failure. Only the server can honestly claim to be
     the server, so it sets the flag when it serves this file. */
  if(!window.COMPASS_ENDPOINT) return null;
  try{
    const r=await fetch("/api/retrieve",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query:q})});
    if(!r.ok) return null;
    const j=await r.json();
    return (j&&Array.isArray(j.hits)&&j.hits.length)?j:null;
  }catch(err){ return null; }
}

function anchorOf(v){
  /* Whatever the pair route settled on for a role, however it got there. */
  if(!v) return null;
  if(v.verdict==="pinned"&&v.pinned_key)
    return {key:v.pinned_key,wording:v.pinned_wording,how:"named in the request"};
  const pick=(v.candidates||[]).find(c=>c.proposed&&c.key);
  if(pick&&v.verdict==="resolved")
    return {key:pick.key,wording:pick.wording,how:"chosen by the model"};
  // No entity inside a string that `esc` will escape: it would render the
  // entity's own source text. Plain words only in here.
  return {key:null,wording:null,how:`not settled: ${v.verdict}`};
}

function pairIntakePanel(){
  const j=ask;

    const a=anchorOf(j.roles&&j.roles[role]);

      ? `<b>${esc(a.key)}</b> &middot; ${esc(a.how)}`
        +(a.wording?`<br>${esc(a.wording)}`:"")

function liveIntakePanel(){
  /* A pair is a different object from a single retrieval: one prose request,
     one pool query, two anchors. Rendering it through the RetrievalRequest

  if(!live&&ask&&ask.rendered_query) return pairIntakePanel();
  const j=live, q=(live&&live.request)||{};

  let h=`<p class="sec">what was encoded &middot; live, not a committed run</p><dl>`
    +row("request",esc(j.query||j.request))

    +row("population",`<em>unset</em> &middot; shipped contract leaves it empty`,true)

function livePanel(){
  const j=live, [top]=j.hits;

  h+=`<dl>`
    +row("query",esc(j.query),true)

    +row("min_cos",`${f4(j.threshold)} &middot; ${j.abstained?`<span class="flag">not cleared</span>`:"cleared"}`,true)

  h+=`<p class="sec">candidates</p><div class="tools">`+j.hits.map(c=>
      `<div class="t"><span class="call"><b>${esc(c.target)}</b>`
      +`${c.key?` &middot; ${esc(c.key)}`:""}</span>`

      +(c.stem?`<div class="t"><span class="call">${esc(c.stem)}</span></div>`:"")
      /* The anchor is PICKED, never typed. The harness resolves the choice to

      +(c.key?`<div class="t"><span class="call">use as</span>`
        +`<button class="g pick" data-anchor="exposure" data-key="${esc(c.key)}">exposure</button>`
        +`<button class="g pick" data-anchor="outcome" data-key="${esc(c.key)}">outcome</button>`
        +`</div>`:"")

  if(j.note) h+=`<p class="sec">known limitation</p>`
    +`<div class="none" style="color:var(--signal)">${esc(j.note)}</div>`;
  return h;
}

function toolLog(log){
